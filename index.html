<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>点击烟花</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;height:100vh;overflow:hidden;
  background:#000;cursor:crosshair;
}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="fire"></canvas>
<script>
const canvas = document.getElementById("fire");
const ctx = canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();
window.onresize=resize;
let particles=[];
class Particle{
  constructor(x,y,color){
    this.x=x;this.y=y;this.sx=(Math.random()-0.5)*6;
    this.sy=(Math.random()-0.5)*6;this.alpha=1;
    this.color=color;this.size=Math.random()*3+1;
  }
  update(){
    this.x+=this.sx;this.y+=this.sy;this.alpha-=0.015;
  }
  draw(){
    ctx.save();
    ctx.globalAlpha=this.alpha;
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}
document.addEventListener("click",e=>{
  const colors=["#ff4757","#fffa65","#70a1ff","#2ed573","#ffa502"];
  for(let i=0;i<80;i++){
    particles.push(new Particle(e.clientX,e.clientY,colors[Math.floor(Math.random()*colors.length)]))
  }
})
function render(){
  requestAnimationFrame(render);
  ctx.fillStyle="rgba(0,0,0,0.1)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    particles[i].update();particles[i].draw();
    if(particles[i].alpha<=0) particles.splice(i,1);
  }
}
render();
</script>
</body>
</html>
