<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>绚丽星空烟花</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;height:100vh;overflow:hidden;
  background:#000;cursor:crosshair;
}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="fire"></canvas>
<script>
const canvas = document.getElementById("fire");
const ctx = canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();
window.onresize=resize;

// 背景闪烁星星
const stars = [];
for(let i=0;i<300;i++){
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.3,
    twinkle: Math.random() * 0.022
  })
}

let particles=[];
class Particle{
  constructor(x,y,color){
    this.x=x;
    this.y=y;
    // 速度，增加重力
    this.sx=(Math.random()-0.5)*7;
    this.sy=(Math.random()-0.5)*7 - 2;
    this.gravity = 0.06;
    this.alpha=1;
    this.color=color;
    this.size=Math.random()*2.5+1;
    this.decay = 0.008 + Math.random()*0.006;
  }
  update(){
    this.sy += this.gravity; // 重力向下拉
    this.x+=this.sx;
    this.y+=this.sy;
    this.alpha -= this.decay;
  }
  draw(){
    ctx.save();
    ctx.globalAlpha=this.alpha;
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// 点击触发烟花
document.addEventListener("click",e=>{
  const colors=["#ff4757","#fffa65","#70a1ff","#2ed573","#ffa502","#ff6b81","#a55eea","#22d2d0"];
  const color = colors[Math.floor(Math.random()*colors.length)];
  // 第一层爆炸
  for(let i=0;i<100;i++){
    particles.push(new Particle(e.clientX,e.clientY,color))
  }
  // 第二层，不同颜色的外圈烟花，层次感更强
  const color2 = colors[Math.floor(Math.random()*colors.length)];
  for(let i=0;i<40;i++){
    particles.push(new Particle(e.clientX,e.clientY,color2))
  }
})

function render(){
  requestAnimationFrame(render);
  // 拖尾，降低透明度，做出残影
  ctx.fillStyle="rgba(4,4,15,0.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 绘制闪烁背景星星
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255, ${0.25 + Math.sin(Date.now()*s.twinkle)*0.35})`;
    ctx.fill();
  })

  for(let i=particles.length-1;i>=0;i--){
    particles[i].update();
    particles[i].draw();
    if(particles[i].alpha<=0) particles.splice(i,1);
  }
}
render();
</script>
</body>
</html>
