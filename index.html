<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星空战机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;
  touch-action:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
canvas{display:block;touch-action:none;}
/* 虚拟炸弹按钮 */
#bombBtn{
  position:fixed;right:24px;bottom:24px;
  width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle,#ff6600,#cc2200);
  border:3px solid #ffcc00;color:#fff;
  font-size:13px;font-weight:bold;
  display:none;align-items:center;justify-content:center;
  z-index:100;box-shadow:0 0 16px rgba(255,100,0,0.7);
  -webkit-tap-highlight-color:transparent;
  transition:transform 0.1s;
}
#bombBtn:active{transform:scale(0.92);}
/* 移动端显示炸弹按钮 */
@media (hover:none) and (pointer:coarse){
  #bombBtn{display:flex;}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="bombBtn">💣<br>炸弹</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 3); // 高清但不超 3 倍

function resize(){
  const w = innerWidth;
  const h = innerHeight;
  canvas.width = w * DPR;
  canvas.height = h * DPR;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 同步鼠标参考尺寸
  canvas.width = w;  // 覆盖成逻辑尺寸，和鼠标事件对齐
  canvas.height = h;
}
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", ()=>setTimeout(resize, 300));

// ========== 输入控制 ==========
const keys = {};
const mouse = { x: canvas.width / 2, y: canvas.height - 120, active: false };

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if(e.code === "Space" && player && player.bomb > 0 && player.hp>0){
    useBomb();
    player.bomb --;
  }
});
window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  mouse.active = true;
});

canvas.addEventListener("click",e=>{
  if(player && player.hp <=0){
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const bx = canvas.width/2;
    const by = canvas.height/2 + 60;
    if(cx > bx-110 && cx < bx+110 && cy>by-30 && cy<by+30){
      resetGame();
    }
  }
})

// ========== 触摸控制 ==========
canvas.addEventListener("touchstart", e=>{
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  mouse.x = t.clientX - rect.left;
  mouse.y = t.clientY - rect.top;
  mouse.active = true;
}, {passive:false});

canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  mouse.x = t.clientX - rect.left;
  mouse.y = t.clientY - rect.top;
  mouse.active = true;
}, {passive:false});

canvas.addEventListener("touchend", e=>{
  e.preventDefault();
  // 触摸结束后战机停在原地（不像鼠标那样还能悬空）
  // mouse.active 保持 true，这样玩家可以触摸别处继续控制
}, {passive:false});

// 虚拟炸弹按钮
const bombBtn = document.getElementById("bombBtn");
bombBtn.addEventListener("touchstart", e=>{
  e.preventDefault();
  if(player && player.bomb > 0 && player.hp>0){
    useBomb();
    player.bomb--;
  }
}, {passive:false});
bombBtn.addEventListener("click", ()=>{
  if(player && player.bomb > 0 && player.hp>0){
    useBomb();
    player.bomb--;
  }
});

// ========== 辅助：判断是否移动端 ==========
const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ========== 星空背景 ==========
const stars = [];
for(let i = 0; i < 200; i++){
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    s: Math.random() * 2 + 0.5,
    v: Math.random() * 1.5 + 0.5
  });
}

function updateStars(){
  for(const s of stars){
    s.y += s.v;
    if(s.y > canvas.height){
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  }
}

function drawStars(){
  for(const s of stars){
    ctx.fillStyle = `rgba(255,255,255, ${0.3 + s.s * 0.2})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
}

// ========== 玩家数据 & 重置函数 ==========
let player;
let totalPickCount = 0;
let bullets = [];
let enemies = [];
let enemyBullets = [];
let items = [];
let explosions = [];
let enemyTimer = 0;
let killCount = 0;
let baseSpawnRate = 70;

function resetGame(){
  player = {
    x: canvas.width / 2,
    y: canvas.height - 120,
    w: 44,
    h: 44,
    speed: 6,
    cooldown: 0,
    fireRate: 8,
    power: 1,
    laser: 0,
    missile: 0,
    gun: 0,
    shield: false,
    bomb: 1,
    score: 0,
    hp: 3,
    maxHp: 3,
    invincible: 0,
    wingmen: []
  };
  totalPickCount = 0;
  baseSpawnRate = 70;
  enemies.length = 0;
  enemyBullets.length = 0;
  items.length = 0;
  explosions.length = 0;
  bullets.length = 0;
  enemyTimer = 0;
  killCount = 0;
  mouse.active = false; // 重置鼠标控制状态
}
resetGame();

function updatePlayer(){
  // 僚机更新（根据 player.missile 数量动态增减）
  updateWingmen();

  if(mouse.active){
    player.x += (mouse.x - player.x) * 0.25;
    player.y += (mouse.y - player.y) * 0.25;
  } else {
    if(keys["arrowleft"] || keys["a"]) player.x -= player.speed;
    if(keys["arrowright"] || keys["d"]) player.x += player.speed;
    if(keys["arrowup"] || keys["w"]) player.y -= player.speed;
    if(keys["arrowdown"] || keys["s"]) player.y += player.speed;
  }

  player.x = Math.max(player.w / 2, Math.min(canvas.width - player.w / 2, player.x));
  player.y = Math.max(player.h / 2, Math.min(canvas.height - player.h / 2, player.y));

  if(player.invincible > 0) player.invincible--;

  player.cooldown++;
  let fr = player.fireRate - player.gun*1.2;
  if(fr<2) fr=2;
  if(player.cooldown >= fr){
    player.cooldown = 0;

    // 普通子弹
    if(player.power === 1){
      bullets.push({x:player.x,y:player.y-20,w:4,h:14,speed:12,damage:1,type:"normal"});
    }else if(player.power ===2){
      bullets.push({x:player.x-12,y:player.y-16,w:4,h:14,speed:12,damage:1,type:"normal"});
      bullets.push({x:player.x+12,y:player.y-16,w:4,h:14,speed:12,damage:1,type:"normal"});
    }else if(player.power >=3){
      bullets.push({x:player.x,y:player.y-20,w:4,h:14,speed:12,damage:1,type:"normal"});
      bullets.push({x:player.x-14,y:player.y-16,w:4,h:14,speed:12,damage:1, vx:-0.8,type:"normal"});
      bullets.push({x:player.x+14,y:player.y-16,w:4,h:14,speed:12,damage:1, vx:0.8,type:"normal"});
    }

    // ===== 机关枪Gun：扇形弹幕，等级越高子弹越多 =====
    if(player.gun>0){
      const bulletCount = player.gun * 2 + 1;
      const angleRange = Math.PI / 3;
      for(let i=0;i<bulletCount;i++){
        const angle = -Math.PI/2 - angleRange/2 + angleRange/(bulletCount-1)*i;
        const spd = 10;
        bullets.push({
          x:player.x, y:player.y-20,
          vx: Math.cos(angle)*spd,
          vy: Math.sin(angle)*spd,
          w:3,h:3,damage:0.4,type:"gun"
        });
      }
    }

    // ===== 追踪导弹：真·持续转向追踪敌机 =====
    for(let i=0;i<player.missile;i++){
      const offset = (i - (player.missile-1)/2)*14;
      bullets.push({
        x:player.x+offset,y:player.y-18,
        vx:0, vy:-7,
        w:6,h:10,speed:5,damage:1.2,type:"missile",turnSpeed:0.05
      });
    }
  }

  // ===== 激光：持续发射，穿透+折射 =====
  if(player.laser>0){
    const offset = (player.laser-1)*12;
    for(let i=0;i<player.laser;i++){
      const ox = player.x - offset/2 + i*12;
      bullets.push({
        x:ox, y:player.y-20,
        vx:0, vy:-14,
        w:3, h:30, damage:0.08, type:"laser",
        pierce:true, refractCount:3, hitEnemies:new Set()
      });
    }
  }
}

function updateWingmen(){
  const targetCount = Math.min(player.missile, 4);
  // 数量不够就加
  while(player.wingmen.length < targetCount){
    const idx = player.wingmen.length;
    const side = (idx % 2 === 0 ? 1 : -1) * (1 + Math.floor(idx/2) * 1.2);
    player.wingmen.push({
      side,         // 左右位置系数
      angle: 0,     // 环绕角度
      cooldown: 0
    });
  }
  // 数量多了就减
  while(player.wingmen.length > targetCount) player.wingmen.pop();

  // 僚机环绕+跟随移动
  for(const w of player.wingmen){
    w.angle += 0.03;
    const orbitR = 50;
    const idealX = player.x + Math.cos(w.angle) * orbitR * (w.side > 0 ? 1 : -1) + w.side * 20;
    const idealY = player.y + Math.sin(w.angle) * 15 - 5;
    w.x = w.x !== undefined ? w.x + (idealX - w.x) * 0.15 : idealX;
    w.y = w.y !== undefined ? w.y + (idealY - w.y) * 0.15 : idealY;
    // 僚机开火
    w.cooldown++;
    // 僚机 150 帧一发（2.5秒），降低子弹密度
    if(w.cooldown >= 150){
      w.cooldown = 0;
      bullets.push({
        x: w.x, y: w.y - 12,
        vx: 0, vy: -5,
        w: 4, h: 8, speed: 5, damage: 0.8, type: "missile", turnSpeed: 0.04
      });
    }
  }
}

function drawWingman(w){
  ctx.save();
  ctx.translate(w.x, w.y);
  // 小机身
  ctx.fillStyle = "#ff9933";
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(-8, 8);
  ctx.lineTo(0, 5);
  ctx.lineTo(8, 8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ffff66";
  ctx.beginPath();
  ctx.arc(0, -2, 2, 0, Math.PI*2);
  ctx.fill();
  // 尾焰
  ctx.fillStyle = "#ff4400";
  ctx.beginPath();
  ctx.moveTo(-3, 8);
  ctx.lineTo(0, 14 + Math.random()*3);
  ctx.lineTo(3, 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  // 先画僚机（在主机下面）
  for(const w of player.wingmen) drawWingman(w);

  ctx.save();
  ctx.translate(player.x, player.y);
  if(player.invincible>0 && Math.floor(player.invincible/4)%2===0){
    ctx.restore();
    return;
  }

  if(player.shield){
    ctx.strokeStyle="#5cf";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,0,32,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle="rgba(80,200,255,0.08)";
    ctx.fill();
  }

  const p = player.power;
  const scale = 1 + (p-1) * 0.12; // power 越大机身越大

  // ======== 升级后炫酷外观 ========
  // power>=2：加大机翼（三角形大翼）
  if(p >= 2){
    ctx.fillStyle = player.gun > 0 ? "#ffcc33" : "#3aa8ff";
    ctx.beginPath();
    ctx.moveTo(-30*scale, 10);
    ctx.lineTo(-14, -5);
    ctx.lineTo(-14, 14);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(30*scale, 10);
    ctx.lineTo(14, -5);
    ctx.lineTo(14, 14);
    ctx.closePath();
    ctx.fill();
  }

  // power>=3：翼尖加导弹挂架
  if(p >= 3){
    ctx.fillStyle = player.missile > 0 ? "#ff8822" : "#777";
    ctx.fillRect(-34*scale, 6, 6, 10);
    ctx.fillRect(28*scale, 6, 6, 10);
  }

  // laser>0：机身紫色发光描边
  if(player.laser > 0){
    ctx.shadowColor = "#cc66ff";
    ctx.shadowBlur = 15 + player.laser * 4;
  }

  // 主机身
  ctx.fillStyle = player.laser > 0 ? "#aa88ff" : (player.gun > 0 ? "#ffdd55" : "#5ad8ff");
  ctx.beginPath();
  ctx.moveTo(0, -24*scale);
  ctx.lineTo(-16*scale, 16);
  ctx.lineTo(-7, 10);
  ctx.lineTo(0, 16);
  ctx.lineTo(7, 10);
  ctx.lineTo(16*scale, 16);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // 座舱
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(0, -2, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#88ddff";
  ctx.beginPath();
  ctx.arc(0, -2, 3, 0, Math.PI * 2);
  ctx.fill();

  // power>=4：座舱光环
  if(p >= 4){
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -2, 8, 0, Math.PI*2);
    ctx.stroke();
  }

  // power>=5：机身再加顶部装饰翼
  if(p >= 5){
    ctx.fillStyle = "#ff4488";
    ctx.beginPath();
    ctx.moveTo(-4, -20);
    ctx.lineTo(0, -30);
    ctx.lineTo(4, -20);
    ctx.closePath();
    ctx.fill();
  }

  // 尾焰
  const flameLen = 12 + (player.gun + player.laser + player.missile) * 2;
  ctx.fillStyle = "#ffb020";
  ctx.beginPath();
  ctx.moveTo(-6, 18);
  ctx.lineTo(0, 18 + flameLen + Math.random()*4);
  ctx.lineTo(6, 18);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ff6600";
  ctx.beginPath();
  ctx.moveTo(-3, 18);
  ctx.lineTo(0, 18 + flameLen*0.6 + Math.random()*3);
  ctx.lineTo(3, 18);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ========== 玩家子弹更新逻辑 ==========
function updateBullets(){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if(b.type==="missile"){
      // 导弹追踪逻辑：寻找最近敌机，缓慢转向
      let nearest = null;
      let minD = 9999;
      for(const e of enemies){
        const d = Math.hypot(e.x - b.x, e.y - b.y);
        if(d<minD){
          minD=d; nearest=e;
        }
      }
      if(nearest){
        const targetAngle = Math.atan2(nearest.y - b.y, nearest.x - b.x);
        const currentAngle = Math.atan2(b.vy, b.vx);
        let delta = targetAngle - currentAngle;
        while(delta > Math.PI) delta -= Math.PI*2;
        while(delta < -Math.PI) delta += Math.PI*2;
        const turn = Math.min(b.turnSpeed, Math.max(-b.turnSpeed, delta));
        const newAng = currentAngle + turn;
        b.vx = Math.cos(newAng)*b.speed;
        b.vy = Math.sin(newAng)*b.speed;
      }
      b.x += b.vx;
      b.y += b.vy;
      // 导弹尾焰粒子：15% 概率 + 限长
      if(Math.random() > 0.85 && explosions.length < 600){
        explosions.push({
          x: b.x - b.vx * 0.3,
          y: b.y - b.vy * 0.3,
          vx: (Math.random()-0.5)*1.2,
          vy: (Math.random()-0.5)*1.2,
          life: 0.45,
          decay: 0.05,
          color: "#ff6600",
          size: Math.random()*2 + 1
        });
      }
    }else if(b.type === "gun"){
      b.x += b.vx;
      b.y += b.vy;
    }else if(b.type === "laser"){
      b.x += b.vx;
      b.y += b.vy;
      // 速度保持恒定
      const spd = Math.hypot(b.vx, b.vy);
      if(spd > 0 && spd !== 14){
        b.vx = b.vx / spd * 14;
        b.vy = b.vy / spd * 14;
      }
      // 出界时销毁
      if(b.y < -30 || b.x < -20 || b.x > canvas.width+20 || b.y > canvas.height+20){
        bullets.splice(i, 1);
        continue;
      }
      // 同帧击中敌机后重置 hitEnemies（新帧可以再击）
      b.hitEnemies = new Set();
      continue; // 激光已经在上方做过出界检测了，跳过下面重复检测
    }else{
      b.y -= b.speed;
      if(b.vx) b.x += b.vx;
    }

    // 出界销毁（激光已 continue 跳过，其他类型正常检测）
    if(b.y < -30 || b.x < -20 || b.x > canvas.width+20 || b.y>canvas.height+20){
      bullets.splice(i, 1);
    }
  }
}

function drawBullets(){
  for(const b of bullets){
    if(b.type==="laser"){
      ctx.save();
      ctx.translate(b.x, b.y);
      const angle = Math.atan2(b.vy, b.vx) + Math.PI/2;
      ctx.rotate(angle);
      ctx.shadowColor = "#cc66ff";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#ddaaff";
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
      ctx.fillStyle = "#ff00ff";
      ctx.fillRect(-b.w/4, -b.h/2, b.w/2, b.h);
      ctx.restore();
    }else if(b.type==="missile"){
      // 导弹：绘制时让矩形沿飞行方向旋转
      ctx.save();
      ctx.translate(b.x, b.y);
      const angle = Math.atan2(b.vy, b.vx) + Math.PI/2;
      ctx.rotate(angle);
      ctx.fillStyle = "#ffaa22";
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
      // 弹头高光
      ctx.fillStyle = "#ffff88";
      ctx.fillRect(-2, -b.h/2, 4, 3);
      ctx.restore();
    }else if(b.type==="gun"){
      ctx.fillStyle="#ffdd66";
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }else{
      ctx.fillStyle="#9be7ff";
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }
  }
}

// ========== 敌机弹幕 雷霆战机扇形斜弹幕 ==========
function updateEnemyBullets(){
  for(let i = enemyBullets.length -1; i >=0; i--){
    const eb = enemyBullets[i];
    eb.x += eb.vx;
    eb.y += eb.vy;
    if(eb.y > canvas.height + 10 || eb.x < -10 || eb.x > canvas.width+10){
      enemyBullets.splice(i,1);
    }
  }
}
function drawEnemyBullets(){
  for(const eb of enemyBullets){
    if(eb.type === "sniper"){
      ctx.fillStyle = "#9944ff";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 3, 0, Math.PI*2);
      ctx.fill();
    } else if(eb.type === "bomber"){
      ctx.fillStyle = "#00ff88";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "rgba(0,255,136,0.3)";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 9, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ff5555";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 4, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

// ========== 敌机 ==========

// 根据 totalPickCount 计算难度因子（全局感知）
function getDifficulty(){
  // ★ 关键：计算玩家当前实际火力威胁分（跟随玩家实时升降！）
  // 每级 power 加 1，laser/missile/gun 各加 2（加成更高）
  const currentPowerScore = 
    (player.power - 1) * 1 +
    player.laser * 2 +
    player.missile * 2 +
    player.gun * 2;

  // 难度上限：历史累计（保证后期不会掉回太容易）
  // 但实际难度跟随当前火力浮动，允许下降
  const maxDiff = totalPickCount;
  const effT = Math.max(2, Math.min(maxDiff, currentPowerScore + 2));
  // 玩家血量越低，给的缓冲越多（受击后短时间内难度降低）
  const hpRatio = player.hp / player.maxHp;
  const hpFactor = hpRatio < 0.4 ? 0.6 : 1; // 残血时难度打 6 折

  const t = effT * hpFactor;

  // 非线性：前期慢，中后期陡增
  const hpMul = 1 + t*0.20 + (t>6 ? (t-6)*0.08 : 0);
  const spdMul = 1 + t*0.04;
  const shootMul = Math.max(0.35, 1 - t*0.04);
  const bigChance = Math.min(0.6, 0.3 + t*0.025);
  const spawnCap = Math.max(20, 70 - t*3.5);
  return { t, hpMul, spdMul, shootMul, bigChance, spawnCap, effT, maxDiff };
}

function spawnEnemy(){
  const d = getDifficulty();
  const t = d.t;

  // 5 种敌机类型：small/medium/drone/sniper/bomber
  let r = Math.random();
  let type;
  if(r < 0.35) type = "small";
  else if(r < 0.60) type = "medium";
  else if(r < 0.78) type = "drone";    // 自杀冲撞型
  else if(r < 0.92) type = "sniper";   // 远程狙击型
  else type = "bomber";                // 螺旋弹幕型

  // 难度越高，整体色调越暗越凶（0.04 让变化真的可见！）
  const darken = Math.min(0.7, t * 0.04);
  let enemy;

  if(type === "small"){
    const col = shadeColor("#ff6b6b", -darken*100);
    enemy = {
      type, x: Math.random()*(canvas.width-60)+30, y: -40,
      w: 32, h: 32,
      hp: Math.ceil(2 * d.hpMul), maxHp: Math.ceil(2 * d.hpMul),
      speed: Math.min(5, 2.2 + t*0.1),
      color: col, score: 100, dropRate: 0.20,
      shootTimer: 0, shootInterval: Math.max(45, 150 * d.shootMul)
    };
  } else if(type === "medium"){
    const col = shadeColor("#ffa94d", -darken*100);
    enemy = {
      type, x: Math.random()*(canvas.width-80)+40, y: -50,
      w: 48, h: 48,
      hp: Math.ceil(5 * d.hpMul), maxHp: Math.ceil(5 * d.hpMul),
      speed: Math.min(4, 1.4 + t*0.07),
      color: col, score: 250, dropRate: 0.40,
      shootTimer: 0, shootInterval: Math.max(35, 100 * d.shootMul)
    };
  } else if(type === "drone"){
    // 小型自杀机，直接冲玩家，打中扣 2 血
    enemy = {
      type, x: Math.random()*(canvas.width-60)+30, y: -30,
      w: 24, h: 24,
      hp: Math.ceil(1 * d.hpMul), maxHp: Math.ceil(1 * d.hpMul),
      speed: Math.min(6, 3.5 + t*0.08),
      color: shadeColor("#ff3377", -darken*100),
      score: 150, dropRate: 0.10,
      drone: true,
      shootTimer: 0, shootInterval: 9999 // 不开枪
    };
  } else if(type === "sniper"){
    // 停在上半屏瞄准玩家，射慢速但大号单发弹
    enemy = {
      type, x: Math.random()*(canvas.width-80)+40, y: -50,
      w: 40, h: 40,
      hp: Math.ceil(4 * d.hpMul), maxHp: Math.ceil(4 * d.hpMul),
      speed: 0.8 + t*0.03, // 慢慢飘
      color: shadeColor("#7744ff", -darken*100),
      score: 300, dropRate: 0.35,
      sniper: true,
      shootTimer: 0, shootInterval: Math.max(60, 180 * d.shootMul)
    };
  } else {
    // bomber：大机，螺旋弹幕
    enemy = {
      type, x: Math.random()*(canvas.width-100)+50, y: -60,
      w: 60, h: 60,
      hp: Math.ceil(10 * d.hpMul), maxHp: Math.ceil(10 * d.hpMul),
      speed: 1.0 + t*0.04,
      color: shadeColor("#00cc88", -darken*100),
      score: 500, dropRate: 0.55,
      bomber: true, spiralAngle: 0,
      shootTimer: 0, shootInterval: Math.max(18, 30 * d.shootMul)
    };
  }
  enemies.push(enemy);
}

// 辅助：让颜色变暗
function shadeColor(color, percent){
  let R = parseInt(color.substring(1,3),16);
  let G = parseInt(color.substring(3,5),16);
  let B = parseInt(color.substring(5,7),16);
  R = Math.max(0, Math.min(255, R + percent));
  G = Math.max(0, Math.min(255, G + percent));
  B = Math.max(0, Math.min(255, B + percent));
  return "#"+[R,G,B].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function updateEnemies(){
  const d = getDifficulty();
  const spawnRate = d.spawnCap;
  enemyTimer++;
  if(enemyTimer >= spawnRate){
    enemyTimer = 0;
    spawnEnemy();
  }

  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    e.shootTimer++;

    // ===== 不同敌机不同行为 =====
    if(e.type === "drone"){
      // 自杀机：直接朝玩家飞
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      e.x += dx / len * e.speed;
      e.y += dy / len * e.speed;
    } else if(e.type === "sniper"){
      // 狙击：先飘到 y=120 左右停住，然后精准瞄准玩家
      if(e.y < 120) e.y += e.speed;
      else e.y += e.speed * 0.1;
      if(e.shootTimer >= e.shootInterval){
        e.shootTimer = 0;
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const len = Math.hypot(dx, dy) || 1;
        const bulletSpeed = 3.2;
        enemyBullets.push({
          x: e.x, y: e.y + e.h/2,
          vx: dx/len*bulletSpeed, vy: dy/len*bulletSpeed,
          w: 10, h: 10, type: "sniper"
        });
      }
    } else if(e.type === "bomber"){
      // 螺旋弹幕
      if(e.y < 100) e.y += e.speed;
      else e.y += e.speed * 0.3;
      if(e.shootTimer >= e.shootInterval){
        e.shootTimer = 0;
        e.spiralAngle += Math.PI / 6;
        const bulletSpeed = 2.0;
        for(let k = 0; k < 3; k++){
          const ang = e.spiralAngle + k * (Math.PI * 2 / 3);
          enemyBullets.push({
            x: e.x, y: e.y,
            vx: Math.cos(ang)*bulletSpeed, vy: Math.sin(ang)*bulletSpeed,
            w: 7, h: 7, type: "bomber"
          });
        }
      }
    } else {
      // small / medium：普通扇形弹
      e.y += e.speed;
      if(e.shootTimer >= e.shootInterval && e.y > 20){
        e.shootTimer = 0;
        const bulletSpeed = 1.8;
        const count = e.type === "medium" ? 5 : 3;
        const spread = 0.3;
        for(let k = 0; k < count; k++){
          const ang = Math.PI/2 + (k - (count-1)/2) * spread;
          enemyBullets.push({
            x: e.x, y: e.y + e.h/2,
            vx: Math.cos(ang)*bulletSpeed,
            vy: Math.sin(ang)*bulletSpeed,
            w: 6, h: 6, type: "normal"
          });
        }
      }
    }

    if(e.y > canvas.height + 80 || e.x < -80 || e.x > canvas.width + 80){
      enemies.splice(i, 1);
    }
  }
}

function drawEnemies(){
  for(const e of enemies){
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.color;

    if(e.type === "drone"){
      // 菱形自杀机
      ctx.beginPath();
      ctx.moveTo(0, -e.h/2);
      ctx.lineTo(e.w/2, 0);
      ctx.lineTo(0, e.h/2);
      ctx.lineTo(-e.w/2, 0);
      ctx.closePath();
      ctx.fill();
      // 红色警示灯
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, 0, 3+Math.sin(Date.now()/80)*1, 0, Math.PI*2);
      ctx.fill();
    } else if(e.type === "sniper"){
      // 三角形狙击机 + 瞄准线
      ctx.beginPath();
      ctx.moveTo(0, e.h/2);
      ctx.lineTo(-e.w/2, -e.h/2);
      ctx.lineTo(e.w/2, -e.h/2);
      ctx.closePath();
      ctx.fill();
      // 炮管（指向玩家）
      const dx = player.x - e.x, dy = player.y - e.y;
      const ang = Math.atan2(dy, dx);
      ctx.rotate(ang + Math.PI/2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-2, -e.h/2-10, 4, 12);
    } else if(e.type === "bomber"){
      // 圆形大轰炸机 + 外圈装饰
      ctx.beginPath();
      ctx.arc(0, 0, e.w/2, 0, Math.PI*2);
      ctx.fill();
      // 旋转外圈
      ctx.strokeStyle = "#ffcc44";
      ctx.lineWidth = 3;
      ctx.beginPath();
      const now = Date.now() / 400;
      for(let k = 0; k < 6; k++){
        const a = now + k * (Math.PI/3);
        ctx.moveTo(Math.cos(a)*(e.w/2+4), Math.sin(a)*(e.w/2+4));
        ctx.lineTo(Math.cos(a)*(e.w/2+14), Math.sin(a)*(e.w/2+14));
      }
      ctx.stroke();
      // 座舱
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI*2);
      ctx.fill();
    } else {
      // small / medium：标准倒三角
      ctx.beginPath();
      ctx.moveTo(0, e.h / 2);
      ctx.lineTo(-e.w / 2, -e.h / 2);
      ctx.lineTo(-e.w / 4, -e.h / 3);
      ctx.lineTo(0, -e.h / 2 + 6);
      ctx.lineTo(e.w / 4, -e.h / 3);
      ctx.lineTo(e.w / 2, -e.h / 2);
      ctx.closePath();
      ctx.fill();
    }

    // 血条
    if(e.hp < e.maxHp){
      ctx.fillStyle = "#222";
      ctx.fillRect(-e.w/2, -e.h/2 - 10, e.w, 4);
      ctx.fillStyle = e.hp/e.maxHp > 0.4 ? "#51ff8a" : "#ff4444";
      ctx.fillRect(-e.w/2, -e.h/2 - 10, e.w * (e.hp / e.maxHp), 4);
    }
    ctx.restore();
  }
}

// ========== 道具系统 ==========
function spawnItem(x,y){
  const r = Math.random();
  let type;
  if(r<0.22) type="power";
  else if(r<0.38) type="laser";
  else if(r<0.52) type="missile";
  else if(r<0.66) type="gun";
  else if(r<0.76) type="shield";
  else if(r<0.84) type="bomb";
  else type="heal";
  items.push({
    x,y,
    w:26,h:26,
    speed:2.2,
    type
  });
}

function updateItems(){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    // 磁吸：距离玩家 <140px 自动吸过去
    const dx = player.x - it.x;
    const dy = player.y - it.y;
    const dist = Math.hypot(dx, dy);
    if(dist < 140){
      const pull = dist < 50 ? 6 : 3;
      it.x += dx / dist * pull;
      it.y += dy / dist * pull;
    } else {
      it.y += it.speed;
    }
    if(it.y>canvas.height+30) items.splice(i,1);
  }
}
function drawItems(){
  for(const it of items){
    ctx.save();
    ctx.translate(it.x,it.y);
    if(it.type==="power") ctx.fillStyle="#ff4444";
    else if(it.type==="laser") ctx.fillStyle="#bb44ff";
    else if(it.type==="missile") ctx.fillStyle="#ff9922";
    else if(it.type==="gun") ctx.fillStyle="#ffdd44";
    else if(it.type==="shield") ctx.fillStyle="#44ff77";
    else if(it.type==="bomb") ctx.fillStyle="#ffdd44";
    else if(it.type==="heal") ctx.fillStyle="#ff4488";
    ctx.beginPath();
    ctx.arc(0,0,13,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#000";
    ctx.font="bold 16px sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    if(it.type==="power") ctx.fillText("P",0,0);
    else if(it.type==="laser") ctx.fillText("L",0,0);
    else if(it.type==="missile") ctx.fillText("M",0,0);
    else if(it.type==="gun") ctx.fillText("G",0,0);
    else if(it.type==="shield") ctx.fillText("S",0,0);
    else if(it.type==="bomb") ctx.fillText("B",0,0);
    else if(it.type==="heal") ctx.fillText("+",0,0);
    ctx.restore();
  }
}

// ========== 碰撞检测 ==========
function collides(a, b){
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 - 4 &&
         Math.abs(a.y - b.y) < (a.h + b.h) / 2 - 4;
}
function circleCollide(p1, p2, r1, r2){
  const dx = p1.x - p2.x;
  const dy = p1.y - p2.y;
  return Math.sqrt(dx*dx + dy*dy) < r1 + r2;
}

function handleCollisions(){
  //子弹 vs 敌机
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    for(let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if(collides(b, e)){
        // 激光：同一帧避免重复击中同一敌机 —— 必须在扣血之前检查！
        if(b.type === "laser"){
          if(!b.hitEnemies) b.hitEnemies = new Set();
          if(b.hitEnemies.has(e)) continue;
          if(b.hitEnemies.size > 8){
            // Set 太大就重建一下，防止内存泄漏
            b.hitEnemies = new Set([...b.hitEnemies].slice(-5));
          }
          b.hitEnemies.add(e);

          e.hp = Math.max(0, e.hp - b.damage);

          if(b.refractCount > 0){
            b.refractCount--;
            const dx = b.x - e.x;
            const dy = b.y - e.y;
            const incAngle = Math.atan2(b.vy, b.vx);
            const speed = Math.hypot(b.vx, b.vy);
            if(Math.abs(dx) > Math.abs(dy)){
              // 横向撞击：水平反弹
              b.vx = (dx > 0 ? 1 : -1) * speed * 0.9;
              b.vy = -Math.abs(b.vy) * 0.8;
            }else{
              // 纵向撞击：随机左右 ±45° 折射
              const turn = (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 4);
              const newAngle = incAngle + turn;
              b.vx = Math.cos(newAngle) * speed;
              b.vy = Math.sin(newAngle) * speed;
            }
          }
          // 激光穿透，不销毁子弹，也不 break，让内层循环继续检查下一个敌机
        }else{
          // 普通子弹 / 导弹直接扣血
          e.hp = Math.max(0, e.hp - b.damage);
          // 导弹额外范围爆炸
          if(b.type === "missile"){
            createExplosion(b.x, b.y, "#ff8822");
            for(let k = enemies.length - 1; k >= 0; k--){
              const e2 = enemies[k];
              if(e2 === e) continue;
              if(Math.hypot(e2.x - b.x, e2.y - b.y) < 45){
                e2.hp = Math.max(0, e2.hp - 0.8);
                if(e2.hp <= 0){
                  player.score += e2.score;
                  killCount++;
                  createExplosion(e2.x, e2.y, e2.color);
                  if(Math.random() < e2.dropRate) spawnItem(e2.x, e2.y);
                  enemies.splice(k, 1);
                }
              }
            }
          }

          // 主目标死亡处理 —— 必须在 break 之前执行！
          if(e.hp <= 0){
            player.score += e.score;
            killCount++;
            createExplosion(e.x, e.y, e.color);
            if(Math.random() < e.dropRate) spawnItem(e.x, e.y);
            enemies.splice(j, 1);
          }
          bullets.splice(i, 1);
          break;
        }

        // 激光的穿透式死亡处理（激光没有 break，会穿透继续检查下一个敌机）
        if(e.hp <= 0){
          player.score += e.score;
          killCount++;
          createExplosion(e.x, e.y, e.color);
          if(Math.random() < e.dropRate) spawnItem(e.x, e.y);
          enemies.splice(j, 1);
        }
      }
    }
  }

  //拾取道具（带等级上限！）
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(collides(player,it)){
      totalPickCount++;
      if(it.type==="power" && player.power < 5) player.power++;
      else if(it.type==="laser" && player.laser < 3) player.laser++;
      else if(it.type==="missile" && player.missile < 4) player.missile++;
      else if(it.type==="gun" && player.gun < 3) player.gun++;
      else if(it.type==="shield") player.shield=true;
      else if(it.type==="bomb") player.bomb++;
      else if(it.type==="heal"){
        if(player.hp<player.maxHp) player.hp++;
      }
      items.splice(i,1);
    }
  }

  //敌机子弹击中玩家
  for(let i = enemyBullets.length -1; i >=0; i--){
    const eb = enemyBullets[i];
    if(player.invincible>0) continue;
    if(circleCollide(player, eb, 20, 5)){
      enemyBullets.splice(i,1);
      if(player.shield){
        player.shield = false;
      }else if(player.hp === 1){
        // 最后一滴血：尝试降级保命
        const ups = [];
        if(player.power > 1) ups.push("power");
        if(player.laser > 0) ups.push("laser");
        if(player.missile > 0) ups.push("missile");
        if(player.gun > 0) ups.push("gun");
        if(ups.length > 0){
          // 有升级可降 → 降级 2 项保命（仁慈机制）
          player.invincible = 90;
          for(let k=0; k<2 && ups.length>0; k++){
            const pickIdx = Math.floor(Math.random()*ups.length);
            player[ups[pickIdx]]--;
            ups.splice(pickIdx, 1);
          }
        }else{
          // 没升级可降 → 老实扣血死亡
          player.hp--;
          player.invincible = 60;
        }
      }else{
        player.hp--;
        player.invincible = 60;
        const ups = [];
        if(player.power > 1) ups.push("power");
        if(player.laser > 0) ups.push("laser");
        if(player.missile > 0) ups.push("missile");
        if(player.gun > 0) ups.push("gun");
        if(ups.length > 0){
          const pick = ups[Math.floor(Math.random()*ups.length)];
          player[pick]--;
        }
      }
    }
  }

  // drone 自杀冲撞机体（直接撞玩家）
  for(let j = enemies.length - 1; j >= 0; j--){
    const e = enemies[j];
    if(!e.drone) continue;
    if(player.invincible > 0) continue;
    if(circleCollide(player, e, 22, 14)){
      createExplosion(e.x, e.y, e.color);
      enemies.splice(j, 1);
      if(player.shield){
        player.shield = false;
      }else if(player.hp <= 2){
        const ups = [];
        if(player.power > 1) ups.push("power");
        if(player.laser > 0) ups.push("laser");
        if(player.missile > 0) ups.push("missile");
        if(player.gun > 0) ups.push("gun");
        if(ups.length > 0){
          player.invincible = 90;
          for(let k=0; k<2 && ups.length>0; k++){
            const pickIdx = Math.floor(Math.random()*ups.length);
            player[ups[pickIdx]]--;
            ups.splice(pickIdx, 1);
          }
        }else{
          player.hp -= 2;
          player.invincible = 90;
        }
      }else{
        player.hp -= 2;
        player.invincible = 90;
      }
    }
  }
}

function useBomb(){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    createExplosion(e.x,e.y,e.color);
    player.score += e.score;
    killCount++; //炸弹击杀也计数
    enemies.splice(i,1);
  }
  enemyBullets.length=0;
  bullets.length=0;
}

function createExplosion(x, y, color){
  // 硬上限 800，粒子不清理会撑爆浏览器！
  if(explosions.length > 800) explosions.splice(0, explosions.length - 800);
  for(let i = 0; i < 24; i++){
    explosions.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function updateExplosions(){
  for(let i = explosions.length - 1; i >= 0; i--){
    const p = explosions[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if(p.life <= 0){
      explosions.splice(i, 1);
    }
  }
}

function drawExplosions(){
  for(const p of explosions){
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

//中文UI
function drawUI(){

  ctx.font = font1;

  ctx.textBaseline="top";

  ctx.fillText(`得分 ${player.score}`, x0, y0); y0 += lh;
  ctx.fillText(`P${player.power} L${player.laser} M${player.missile} G${player.gun}`, x0, y0); y0 += lh;
  ctx.fillText(`💣${player.bomb} 🛡${player.shield?"开":"关"} ❤${player.hp}/${player.maxHp}`, x0, y0);

  // 移动端：炸弹按钮数字 + 状态反馈
  if(isMobile){
    const bb = document.getElementById("bombBtn");
    bb.textContent = `💣炸弹 ${player.bomb}`;
    bb.style.opacity = player.bomb > 0 && player.hp > 0 ? "1" : "0.35";
  }

  if(player.hp <=0){
    ctx.fillStyle="#fff";
    ctx.font = small ? "bold 32px sans-serif" : "bold 44px sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("游戏结束", canvas.width/2, canvas.height/2-80);
    ctx.font = small ? "bold 22px sans-serif" : "bold 28px sans-serif";
    ctx.fillText(`最终得分：${player.score}`, canvas.width/2, canvas.height/2-20);
    ctx.fillText(`击败敌机：${killCount} 架`, canvas.width/2, canvas.height/2+20);

    const bw = small ? 200 : 220;
    const bh = small ? 46 : 50;
    ctx.fillStyle="#2277dd";
    ctx.fillRect(canvas.width/2-bw/2, canvas.height/2+60, bw, bh);
    ctx.fillStyle="#fff";
    ctx.font = small ? "bold 20px sans-serif" : "bold 24px sans-serif";
    ctx.fillText("重新开始", canvas.width/2, canvas.height/2+60+bh/2);
  }
}

function loop(){
  ctx.fillStyle = "#000814";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if(player.hp <= 0){
    drawUI();
    requestAnimationFrame(loop);
    return;
  }

  updateStars();
  drawStars();

  updatePlayer();
  updateBullets();
  updateEnemies();
  updateEnemyBullets();
  updateItems();
  handleCollisions();
  updateExplosions();

  drawBullets();
  drawEnemies();
  drawEnemyBullets();
  drawItems();
  drawExplosions();
  drawPlayer();
  drawUI();

  requestAnimationFrame(loop);
}

window.onload = function(){
  loop();
}
</script>
</body>
</html>
