<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>点击生成猫咪</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: linear-gradient(135deg, #ffeaa7, #fab1a0, #fd79a8);
    height: 100vh;
    width: 100vw;
    cursor: pointer;
  }
  .cat {
    position: absolute;
    width: 120px;
    height: 120px;
    pointer-events: none;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    animation: pop 0.3s ease-out;
  }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    80% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<script>
// 页面加载完成后再绑定点击事件
document.addEventListener('DOMContentLoaded', function(){
  const catImages = [
    "https://placekitten.com/100/100",
    "https://placekitten.com/101/101",
    "https://placekitten.com/102/102",
    "https://placekitten.com/103/103"
  ];

  document.addEventListener('click', (e) => {
    alert("点击生效！"); // ✅ 测试用！点页面会弹出这个提示框
    const cat = document.createElement('div');
    cat.classList.add('cat');

    const randomCat = catImages[Math.floor(Math.random() * catImages.length)];
    cat.style.backgroundImage = `url(${randomCat})`;
    cat.style.left = e.clientX + 'px';
    cat.style.top = e.clientY + 'px';

    const size = 80 + Math.random() * 80;
    cat.style.width = size + 'px';
    cat.style.height = size + 'px';

    document.body.appendChild(cat);
  });
})
</script>
</body>
</html>
