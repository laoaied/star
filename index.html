// 根据 totalPickCount 计算难度因子（全局感知）
function getDifficulty(){
  // ★ 关键：计算玩家当前实际火力威胁分（跟随玩家实时升降！）
  // 每级 power 加 1，laser/missile/gun 各加 2（加成更高）
  const currentPowerScore = 
    (player.power - 1) * 1 +
    player.laser * 2 +
    player.missile * 2 +
    player.gun * 2;

  // 难度上限：历史累计（保证后期不会掉回太容易）
  // 但实际难度跟随当前火力浮动，允许下降
  const maxDiff = totalPickCount;
  const effT = Math.max(2, Math.min(maxDiff, currentPowerScore + 2));
  // 玩家血量越低，给的缓冲越多（受击后短时间内难度降低）
  const hpRatio = player.hp / player.maxHp;
  const hpFactor = hpRatio < 0.4 ? 0.6 : 1; // 残血时难度打 6 折

  const t = effT * hpFactor;

  // 非线性：前期慢，中后期陡增
  const hpMul = 1 + t*0.20 + (t>6 ? (t-6)*0.08 : 0);
  const spdMul = 1 + t*0.04;
  const shootMul = Math.max(0.35, 1 - t*0.04);
  const bigChance = Math.min(0.6, 0.3 + t*0.025);
  const spawnCap = Math.max(20, 70 - t*3.5);
  return { t, hpMul, spdMul, shootMul, bigChance, spawnCap, effT, maxDiff };
}

// ===== BOSS 行为（按 bossType 分支）=====
function updateBoss(e){
  e.shootTimer++;
  e.patternTimer++;
  const lv = e.bossLevel;

  // ==== 入场（所有 BOSS 通用）====
  if(e.phase === "entry"){
    if(e.y < 120) e.y += e.speed;
    else{
      e.phase = "fight";
      createExplosion(e.x, e.y, e.color);
    }
    if(e.shootTimer >= 60){
      e.shootTimer = 0;
      const spd = 2.5;
      for(let k = 0; k < 5; k++){
        const ang = Math.PI/2 + (k-2)*0.18;
        enemyBullets.push({
          x: e.x, y: e.y+e.h/2,
          vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
          w: 6*S, h: 6*S, type: "normal", isBossBullet: true
        });
      }
    }
    return;
  }

  // ==== 狂暴 ====
  if(e.phase !== "rage" && e.hp < e.maxHp * 0.3){
    e.phase = "rage";
    createExplosion(e.x, e.y, "#ff4444");
  }
  const rageMul = e.phase === "rage" ? 1.3 : 1.0;

  // =============== 按类型分支 ===============
  if(e.bossType === "diamond" || e.bossType === "saucer" || !e.bossType){
    // ========= 经典款：3 pattern + 光束 =========
    // 光束技能
    if(e.beamActive > 0){
      e.beamActive--;
      const d = distPointToSegment(player.x, player.y, e.x, e.y, e.beamTX, e.beamTY);
      if(d < 16 * S && player.invuln <= 0){
        player.hp--; player.invuln = 60;
        createExplosion(player.x, player.y, "#ffffff");
      }
    } else if(e.beamWarn > 0){
      e.beamWarn--;
      if(e.beamWarn === 0){
        e.beamActive = 12;
        e.beamTimer = 420 + Math.random()*120;
      }
    } else {
      e.beamTimer--;
      if(e.beamTimer <= 0){
        const dx = player.x - e.x, dy = player.y - e.y;
        const edge = rayToEdge(e.x, e.y, dx, dy);
        e.beamTX = edge.x; e.beamTY = edge.y;
        e.beamWarn = 120;
      }
    }
    // 横向走位
    e.moveTimer++;
    if(e.moveTimer > 120){ e.moveTimer = 0; e.targetX = Math.max(80, Math.min(canvas.width-80, e.x+(Math.random()-0.5)*200)); }
    e.x += (e.targetX - e.x) * 0.02;

    if(e.patternTimer > 180){ e.patternTimer = 0; e.pattern = (e.pattern+1)%3; }
    const spd = (e.phase === "rage" ? 2.8 : 2.2);
    if(e.shootTimer >= e.shootInterval){
      e.shootTimer = 0;
      if(e.pattern === 0){
        const count = 7 + lv;
        for(let k = 0; k < count; k++){
          const ang = Math.PI/2 - Math.PI/6 + (Math.PI/3)/(count-1)*k;
          enemyBullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,w:6*S,h:6*S,type:"normal",isBossBullet:true});
        }
      } else if(e.pattern === 1){
        enemyBullets.push({x:e.x,y:e.y+e.h/2,vx:0,vy:3.2,w:10*S,h:10*S,type:"sniper",isBossBullet:true});
        e.spiralAngle += Math.PI/8;
        for(let k = 0; k < 4 + Math.floor(lv/2); k++){
          const ang = e.spiralAngle + k*(Math.PI*2/(4+Math.floor(lv/2)));
          enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*spd*0.9,vy:Math.sin(ang)*spd*0.9,w:7*S,h:7*S,type:"bomber",isBossBullet:true});
        }
      } else {
        const count = 10 + lv*2;
        for(let k = 0; k < count; k++){
          const ang = k*(Math.PI*2/count);
          enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,w:6*S,h:6*S,type:"normal",isBossBullet:true});
        }
      }
    }

  } else if(e.bossType === "mech"){
    // ========= 三角机甲：激光预警 + 瞬移 + 机枪散弹 =========
    const mechSpd = 2.0 * rageMul;
    // 瞬移：每 8-10 秒瞬移一次
    e.teleportTimer--;
    if(e.teleportTimer <= 0){
      // 瞬移闪光特效 + 换位置
      createExplosion(e.x, e.y, e.accent);
      e.x = Math.max(80, Math.min(canvas.width-80, Math.random()*(canvas.width-160)+80));
      e.y = 60 + Math.random()*80; // 瞬移保持在上半区
      createExplosion(e.x, e.y, e.accent);
      e.teleportTimer = 480 + Math.random()*120;
      createExplosion(e.x, e.y, "#ffffff");
    }
    // 平滑微漂移
    e.moveTimer++;
    if(e.moveTimer > 60){ e.moveTimer = 0; e.targetX = Math.max(80, Math.min(canvas.width-80, e.x+(Math.random()-0.5)*100)); }
    e.x += (e.targetX - e.x) * 0.015;

    // 激光循环
    if(e.mechLaserPhase === 0){
      e.mechLaserTimer++;
      if(e.mechLaserTimer >= 200){ // 3.3 秒冷却
        e.mechLaserPhase = 1;
        e.mechLaserTimer = 0;
        e.mechLaserTX = player.x; e.mechLaserTY = player.y;
      }
    } else if(e.mechLaserPhase === 1){
      e.mechLaserTimer++;
      if(e.mechLaserTimer >= 100){ // 1.6 秒预警
        e.mechLaserPhase = 2;
        e.mechLaserTimer = 0;
      }
    } else {
      // 发射阶段：伤害判定
      e.mechLaserTimer++;
      const dx = e.mechLaserTX - e.x, dy = e.mechLaserTY - e.y;
      const edge = rayToEdge(e.x, e.y, dx, dy);
      const d = distPointToSegment(player.x, player.y, e.x, e.y, edge.x, edge.y);
      if(d < 18*S && player.invuln <= 0){
        player.hp--; player.invuln = 60;
        createExplosion(player.x, player.y, e.color);
      }
      if(e.mechLaserTimer >= 15){ e.mechLaserPhase = 0; e.mechLaserTimer = 0; }
    }

    // 机枪散弹
    if(e.shootTimer >= e.shootInterval){
      e.shootTimer = 0;
      // 扇形 9 发，速度慢一点方便躲
      const count = 9 + lv;
      const spread = Math.PI/2;
      const t0 = Date.now();
      for(let k = 0; k < count; k++){
        const ang = Math.PI/2 - spread/2 + spread/(count-1)*k + Math.sin(t0/300 + k*0.3)*0.05;
        enemyBullets.push({x:e.x,y:e.y+e.h/2,vx:Math.cos(ang)*mechSpd,vy:Math.sin(ang)*mechSpd,w:5*S,h:5*S,type:"normal",isBossBullet:true});
      }
    }

  } else if(e.bossType === "crab"){
    // ========= 深渊巨蟹：慢速圆弹 + 清弹幕 + 分裂 =========
    // 原地不动（稍微上下飘）
    e.y = 140 + Math.sin(Date.now()/800) * 15;
    e.x += (canvas.width/2 - e.x) * 0.01;

    // 清玩家弹幕（只在分裂前的主巨蟹有这个能力）
    if(e.splitStage === 0 && e.crabPurgeTimer !== undefined){
      e.crabPurgeTimer--;
      if(e.crabPurgeTimer <= 0){
        // 清掉所有玩家子弹
        for(const b of bullets) createExplosion(b.x, b.y, e.accent);
        bullets.length = 0;
        createExplosion(e.x, e.y+40, e.accent);
        e.crabPurgeTimer = 1500 + Math.random()*600; // 25-35 秒一次
      }
    }

    // 慢速圆形弹幕（稀疏可躲）
    e.crabOrbTimer--;
    if(e.crabOrbTimer <= 0){
      e.crabOrbTimer = 120 - (lv-1)*8; // 约 1.5 秒一轮
      const count = 14 + lv*2 - e.splitStage*4; // 分裂后弹幕更少
      const spd = (1.6 - e.splitStage*0.3) * rageMul; // 分裂后更慢
      e.spiralAngle += Math.PI/6;
      for(let k = 0; k < count; k++){
        const ang = e.spiralAngle + k*(Math.PI*2/count);
        enemyBullets.push({
          x:e.x + Math.cos(ang)*e.w*0.4,
          y:e.y + Math.sin(ang)*e.h*0.4,
          vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
          w:7*S, h:7*S, type:"bomber", isBossBullet:true
        });
      }
    }
  }
}

// ===== BOSS 死亡烟花特效 =====
function onBossDefeated(boss){
  const cs = ["#ff4444","#ffaa00","#ffff66","#44ff88","#44aaff","#aa44ff","#ffffff"];
  createExplosion(boss.x, boss.y, boss.color);
  for(let r = 0; r < 4; r++){
    setTimeout(()=>{
      for(let k = 0; k < 8+r*2; k++){
        const a = k*(Math.PI*2/(8+r*2)), d = 30+r*40;
        createExplosion(boss.x+Math.cos(a)*d+(Math.random()-0.5)*20,
          boss.y+Math.sin(a)*d+(Math.random()-0.5)*20,
          cs[Math.floor(Math.random()*cs.length)]);
      }
    }, r*150);
  }
}

// ========== BOSS 生成 ==========
function spawnBoss(level){
  // 清屏！BOSS 出场前普通敌机先撤走
  for(const e of enemies){
    if(e.type !== "boss") createExplosion(e.x, e.y, e.color);
  }
  enemies.length = 0;
  enemyBullets.length = 0;

  // ===== 4 种 BOSS 类型 =====
  const allBossTypes = [
    { key: "diamond", name: "菱形战机", color: "#6644ff", accent: "#ffcc44" },
    { key: "saucer",  name: "异形飞碟", color: "#aa22aa", accent: "#44ffaa" },
    { key: "mech",    name: "三角机甲", color: "#22aacc", accent: "#ffff44" },
    { key: "crab",    name: "深渊巨蟹", color: "#cc0033", accent: "#ff8800" },
  ];
  // Lv1-4 固定教学顺序，Lv5+ 全类型随机（让玩家永远有新鲜感）
  let bt;
  if(level <= 4) bt = allBossTypes[level - 1];
  else bt = allBossTypes[Math.floor(Math.random() * allBossTypes.length)];

  const bossSize = (100 + level * 10) * S;
  const boss = {
    type: "boss",
    bossType: bt.key,
    bossName: bt.name,
    x: canvas.width / 2,
    y: -bossSize,
    w: bossSize, h: bossSize,
    hp: Math.ceil((60 + level * 35) * 5),
    maxHp: Math.ceil((60 + level * 35) * 5),
    speed: 1.0,
    color: bt.color,
    accent: bt.accent,
    score: 2000 + level * 1000,
    dropRate: 1.0,
    bossLevel: level,
    phase: "entry",
    shootTimer: 0,
    shootInterval: 50,
    pattern: 0,
    patternTimer: 0,
    spiralAngle: 0,
    moveTimer: 0,
    targetX: canvas.width / 2,
    beamTimer: 300,
    beamWarn: 0,
    beamActive: 0,
    beamTX: 0, beamTY: 0,
    // mech 专属：激光+瞬移
    mechLaserPhase: 0, mechLaserTimer: 180,
    mechLaserTX: 0, mechLaserTY: 0,
    teleportTimer: 480,
    // crab 专属：分裂+清弹
    splitStage: 0,
    crabPurgeTimer: 1200,
    crabOrbTimer: 200,
  };
  enemies.push(boss);
}

// 5 种敌机类型：small/medium/drone/sniper/bomber
function spawnEnemy(){
  const d = getDifficulty();
  const t = d.t;
  // 新分布：small 25%, medium 15%, drone 10%, sniper 8%, bomber 6%,
  //         laserDrone 6%, deflect 8%, tumor 10%, splitter 12%
  let r = Math.random();
  let type;
  const laserCount = enemies.filter(e => e.type === "laserDrone").length;

  if(r < 0.25) type = "small";
  else if(r < 0.40) type = "medium";
  else if(r < 0.50) type = "drone";    // 自杀冲撞型
  else if(r < 0.58) type = "sniper";   // 远程狙击型
  else if(r < 0.64) type = "bomber";   // 螺旋弹幕型
  else if(r < 0.70 && laserCount < 2) type = "laserDrone"; // 激光机，场上最多2个
  else if(r < 0.78) type = "deflect";  // 消弹机
  else if(r < 0.88) type = "tumor";     // 肉瘤
  else type = "splitter";              // 分裂怪

  // 难度越高，整体色调越暗越凶（0.04 让变化真的可见！）
  const darken = Math.min(0.7, t * 0.04);
  let enemy;

  if(type === "small"){
    const col = shadeColor("#ff6b6b", -darken*100);
    enemy = {
      type, x: Math.random()*(canvas.width-60)+30, y: -40,
      w: 32 * S, h: 32 * S,
      hp: Math.ceil(2 * d.hpMul), maxHp: Math.ceil(2 * d.hpMul),
      speed: Math.min(5, 2.2 + t*0.1) * (isMobile ? 0.75 : 1),
      color: col, score: 100, dropRate: 0.20,
      shootTimer: 0, shootInterval: Math.max(45, 150 * d.shootMul)
    };
  } else if(type === "medium"){
    const col = shadeColor("#ffa94d", -darken*100);
    enemy = {
      type, x: Math.random()*(canvas.width-80)+40, y: -50,
      w: 48 * S, h: 48 * S,
      hp: Math.ceil(5 * d.hpMul), maxHp: Math.ceil(5 * d.hpMul),
      speed: Math.min(4, 1.4 + t*0.07) * (isMobile ? 0.75 : 1),
      color: col, score: 250, dropRate: 0.40,
      shootTimer: 0, shootInterval: Math.max(35, 100 * d.shootMul)
    };
  } else if(type === "drone"){
    // 小型自杀机，直接冲玩家，打中扣 2 血
    enemy = {
      type, x: Math.random()*(canvas.width-60)+30, y: -30,
      w: 24 * S, h: 24 * S,
      hp: Math.ceil(1 * d.hpMul), maxHp: Math.ceil(1 * d.hpMul),
      speed: Math.min(6, 3.5 + t*0.08) * (isMobile ? 0.75 : 1),
      color: shadeColor("#ff3377", -darken*100),
      score: 150, dropRate: 0.10,
      drone: true,
      shootTimer: 0, shootInterval: 9999 // 不开枪
    };
  } else if(type === "sniper"){
    // 停在上半屏瞄准玩家，射慢速但大号单发弹
    enemy = {
      type, x: Math.random()*(canvas.width-80)+40, y: -50,
      w: 40 * S, h: 40 * S,
      hp: Math.ceil(4 * d.hpMul), maxHp: Math.ceil(4 * d.hpMul),
      speed: (0.8 + t*0.03) * (isMobile ? 0.75 : 1),
      color: shadeColor("#7744ff", -darken*100),
      score: 300, dropRate: 0.35,
      sniper: true,
      shootTimer: 0, shootInterval: Math.max(60, 180 * d.shootMul)
    };
  } else if(type === "bomber"){
    // bomber：大机，螺旋弹幕
    enemy = {
      type, x: Math.random()*(canvas.width-100)+50, y: -60,
      w: 60 * S, h: 60 * S,
      hp: Math.ceil(10 * d.hpMul), maxHp: Math.ceil(10 * d.hpMul),
      speed: (1.0 + t*0.04) * (isMobile ? 0.75 : 1),
      color: shadeColor("#00cc88", -darken*100),
      score: 500, dropRate: 0.55,
      bomber: true, spiralAngle: 0,
      shootTimer: 0, shootInterval: Math.max(18, 30 * d.shootMul)
    };
  } else if(type === "laserDrone"){
    // laserDrone：激光机，预警后发射贯穿光束
    enemy = {
      type, x: Math.random()*(canvas.width-60)+30, y: -30,
      w: 40 * S, h: 40 * S,
      hp: Math.ceil(7 * d.hpMul), maxHp: Math.ceil(7 * d.hpMul),
      speed: (0.8 + t*0.02) * (isMobile ? 0.75 : 1),
      color: shadeColor("#ff2266", -darken*100),
      score: 400, dropRate: 0.40,
      shootTimer: 0, shootInterval: 200,
      laserPhase: 0,     // 0冷却, 1预警, 2发射
      laserTimer: 120,
      laserTX: 0, laserTY: 0
    };
  } else if(type === "deflect"){
    // deflect：消弹机，有弧形护盾可清除玩家子弹
    enemy = {
      type, x: Math.random()*(canvas.width-60)+30, y: -30,
      w: 44 * S, h: 44 * S,
      hp: Math.ceil(6 * d.hpMul), maxHp: Math.ceil(6 * d.hpMul),
      speed: (1.0 + t*0.03) * (isMobile ? 0.75 : 1),
      color: shadeColor("#22ddaa", -darken*100),
      score: 350, dropRate: 0.35,
      shootTimer: 0, shootInterval: 130,
      arcAngle: 0
    };
  } else if(type === "tumor"){
    // tumor：肉瘤，超高血量慢速爬行（大体积、高饱和、慢到几乎爬不动）
    enemy = {
      type, x: Math.random()*(canvas.width-160)+80, y: -80,
      w: 130 * S, h: 130 * S,
      hp: Math.ceil(35 * d.hpMul), maxHp: Math.ceil(35 * d.hpMul),
      speed: (0.22 + t*0.008) * (isMobile ? 0.75 : 1),
      color: "#ff33cc", // 高饱和亮粉紫，不随难度变暗！确保醒目
      score: 800, dropRate: 0.50,
      shootTimer: 0, shootInterval: 9999,
      tumor: true
    };
  } else if(type === "splitter"){
    // splitter：分裂怪，死亡时分裂成2个小型子体
    enemy = {
      type, x: Math.random()*(canvas.width-60)+30, y: -30,
      w: 36 * S, h: 36 * S,
      hp: Math.ceil(4 * d.hpMul), maxHp: Math.ceil(4 * d.hpMul),
      speed: (1.1 + t*0.04) * (isMobile ? 0.75 : 1),
      color: shadeColor("#88cc44", -darken*100),
      score: 200, dropRate: 0.25,
      shootTimer: 0, shootInterval: 9999,
      splitGen: 0  // 分裂代数，0=原始, 1=子, 2=孙（最多分裂2代）
    };
  }
  enemies.push(enemy);
}

// 辅助：让颜色变暗
function shadeColor(color, percent){
  let R = parseInt(color.substring(1,3),16);
  let G = parseInt(color.substring(3,5),16);
  let B = parseInt(color.substring(5,7),16);
  R = Math.max(0, Math.min(255, R + percent));
  G = Math.max(0, Math.min(255, G + percent));
  B = Math.max(0, Math.min(255, B + percent));
  return "#"+[R,G,B].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function updateEnemies(){
  // ===== BOSS 触发：冷却倒计时 =====
  const hasBoss = enemies.some(e => e.type === "boss");
  if(!hasBoss){
    bossCooldown--;
    if(bossCooldown <= 0){
      bossCount++;
      spawnBoss(bossCount);
      return;
    }
  } else {
    bossCooldown = 2400; // 有 BOSS 时重置（打完再计时）
  }

  const d = getDifficulty();
  const spawnRate = d.spawnCap;
  enemyTimer++;
  // 有 BOSS 时不刷普通敌机（画面干净点）
  if(!hasBoss && enemyTimer >= spawnRate){
    enemyTimer = 0;
    spawnEnemy();
  }

  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];

    // ===== BOSS 行为逻辑 =====
    if(e.type === "boss"){
      updateBoss(e);
      continue;
    }

    e.shootTimer++;

    // ===== 不同敌机不同行为 =====
    if(e.type === "drone"){
      // 自杀机：直接朝玩家飞
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      e.x += dx / len * e.speed;
      e.y += dy / len * e.speed;
    } else if(e.type === "sniper"){
      // 狙击：先飘到 y=120 左右停住，然后精准瞄准玩家
      if(e.y < 120) e.y += e.speed;
      else e.y += e.speed * 0.1;
      if(e.shootTimer >= e.shootInterval){
        e.shootTimer = 0;
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const len = Math.hypot(dx, dy) || 1;
        const bulletSpeed = 3.2;
        enemyBullets.push({
          x: e.x, y: e.y + e.h/2,
          vx: dx/len*bulletSpeed, vy: dy/len*bulletSpeed,
          w: 10*S, h: 10*S, type: "sniper"
        });
      }
    } else if(e.type === "bomber"){
      // 螺旋弹幕
      if(e.y < 100) e.y += e.speed;
      else e.y += e.speed * 0.3;
      if(e.shootTimer >= e.shootInterval){
        e.shootTimer = 0;
        e.spiralAngle += Math.PI / 6;
        const bulletSpeed = 2.0;
        for(let k = 0; k < 3; k++){
          const ang = e.spiralAngle + k * (Math.PI * 2 / 3);
          enemyBullets.push({
            x: e.x, y: e.y,
            vx: Math.cos(ang)*bulletSpeed, vy: Math.sin(ang)*bulletSpeed,
            w: 7*S, h: 7*S, type: "bomber"
          });
        }
      }
    } else if(e.type === "laserDrone"){
      // 激光机：下沉→悬停→冷却→瞄准→2秒预警→发射15帧激光
      if(e.y < 140) e.y += e.speed;
      else { e.y += e.speed * 0.05; e.x += Math.sin(Date.now()/500)*0.5; }
      e.laserTimer++;
      if(e.laserPhase === 0){ // 冷却中
        if(e.laserTimer >= 180){ e.laserPhase = 1; e.laserTimer = 0; }
      } else if(e.laserPhase === 1){ // 预警 120帧（2秒）
        if(e.laserTimer === 1){
          // 锁定玩家位置
          e.laserTX = player.x;
          e.laserTY = player.y;
        }
        if(e.laserTimer >= 120){ e.laserPhase = 2; e.laserTimer = 0; }
      } else { // 发射 15帧
        if(e.laserTimer === 5){
          // 发射瞬间检测玩家是否在激光线上（用点到线段距离）
          const dx = e.laserTX - e.x, dy = e.laserTY - e.y;
          const len = Math.hypot(dx, dy) || 1;
          const A = player.x - e.x, B = player.y - e.y;
          const t = Math.max(0, Math.min(1, (A*dx+B*dy)/(len*len)));
          const cx = e.x + dx*t, cy = e.y + dy*t;
          if(Math.hypot(player.x-cx, player.y-cy) < 18*S){
            if(player.invuln <= 0){
              if(player.hp > 1) player.hp--;
              else killCount++; // hp=1且无升级可扣时直接死
              player.invuln = 100;
              createExplosion(player.x, player.y, "#ff2266");
            }
          }
        }
        if(e.laserTimer >= 15){ e.laserPhase = 0; e.laserTimer = 0; }
      }
    } else if(e.type === "deflect"){
      // 消弹机：下沉→悬停→发射弧形弹幕，弧形弹会清我方弹
      if(e.y < 160) e.y += e.speed;
      else { e.y += e.speed * 0.1; e.x += Math.sin(Date.now()/700)*0.8; }
      if(e.shootTimer >= e.shootInterval && e.y > 30){
        e.shootTimer = 0;
        e.arcAngle++;
        // 弧形 11 发，向左扫
        for(let k = 0; k < 11; k++){
          const ang = Math.PI*0.6 + k*0.12; // 从 108°到 228° 扫过玩家正上方
          enemyBullets.push({
            x: e.x, y: e.y,
            vx: Math.cos(ang)*2.0, vy: Math.sin(ang)*2.0,
            w: 8*S, h: 8*S, type: "deflect", isDeflect: true
          });
        }
      }
    } else if(e.type === "tumor"){
      // 肉瘤：移动极慢，不攻击，触底扣玩家血
      e.y += e.speed;
      if(e.y > canvas.height - e.h/2 - 10){
        // 触底！给玩家扣血
        if(player.invuln <= 0){
          player.hp--;
          player.invuln = 120;
          createExplosion(player.x, player.y, e.color);
        }
        // 自己炸掉（用 i 索引安全删除，不用 indexOf）
        createExplosion(e.x, e.y, e.color);
        player.score += e.score;
        killCount++;
        enemies.splice(i, 1);
        continue; // 继续循环，不要 return！
      }
    } else if(e.type === "splitter"){
      // 分裂怪：缓慢朝玩家移动，不攻击，碰撞扣血
      const dx = player.x - e.x, dy = player.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      e.x += dx/len * e.speed;
      e.y += dy/len * e.speed;
    } else {
      // small / medium：普通扇形弹
      e.y += e.speed;
      if(e.shootTimer >= e.shootInterval && e.y > 20){
        e.shootTimer = 0;
        const bulletSpeed = 1.3;
        const count = e.type === "medium" ? 5 : 3;
        const spread = 0.3;
        for(let k = 0; k < count; k++){
          const ang = Math.PI/2 + (k - (count-1)/2) * spread;
          enemyBullets.push({
            x: e.x, y: e.y + e.h/2,
            vx: Math.cos(ang)*bulletSpeed,
            vy: Math.sin(ang)*bulletSpeed,
            w: 6*S, h: 6*S, type: "normal"
          });
        }
      }
    }

    if(e.y > canvas.height + 80 || e.x < -80 || e.x > canvas.width + 80){
      enemies.splice(i, 1);
    }
  }
}

function drawEnemies(){
  for(const e of enemies){
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.color;

    if(e.type === "drone"){
      // 菱形自杀机
      ctx.beginPath();
      ctx.moveTo(0, -e.h/2);
      ctx.lineTo(e.w/2, 0);
      ctx.lineTo(0, e.h/2);
      ctx.lineTo(-e.w/2, 0);
      ctx.closePath();
      ctx.fill();
      // 红色警示灯
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, 0, 3+Math.sin(Date.now()/80)*1, 0, Math.PI*2);
      ctx.fill();
    } else if(e.type === "sniper"){
      // 三角形狙击机 + 瞄准线
      ctx.beginPath();
      ctx.moveTo(0, e.h/2);
      ctx.lineTo(-e.w/2, -e.h/2);
      ctx.lineTo(e.w/2, -e.h/2);
      ctx.closePath();
      ctx.fill();
      // 炮管（指向玩家）
      const dx = player.x - e.x, dy = player.y - e.y;
      const ang = Math.atan2(dy, dx);
      ctx.rotate(ang + Math.PI/2);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-2, -e.h/2-10, 4, 12);
    } else if(e.type === "bomber"){
      // 圆形大轰炸机 + 外圈装饰
      ctx.beginPath();
      ctx.arc(0, 0, e.w/2, 0, Math.PI*2);
      ctx.fill();
      // 旋转外圈
      ctx.strokeStyle = "#ffcc44";
      ctx.lineWidth = 3;
      ctx.beginPath();
      const now = Date.now() / 400;
      for(let k = 0; k < 6; k++){
        const a = now + k * (Math.PI/3);
        ctx.moveTo(Math.cos(a)*(e.w/2+4), Math.sin(a)*(e.w/2+4));
        ctx.lineTo(Math.cos(a)*(e.w/2+14), Math.sin(a)*(e.w/2+14));
      }
      ctx.stroke();
      // 座舱
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI*2);
      ctx.fill();
    } else if(e.type === "boss"){
      const now = Date.now() / 300;
      const rageFlash = e.phase === "rage" && Math.sin(Date.now()/80) > 0;
      const mainCol = rageFlash ? "#ffffff" : e.color;
      const rageCol = rageFlash ? "#ff0000" : e.color;
      const accCol = rageFlash ? "#ff6666" : (e.accent || "#ffcc44");
      ctx.shadowColor = rageCol;
      ctx.shadowBlur = 20;

      if(e.bossType === "diamond" || !e.bossType){
        // ===== Lv1：菱形战机 =====
        ctx.fillStyle = mainCol;
        ctx.beginPath();
        ctx.moveTo(0, e.h/2);
        ctx.lineTo(e.w/2, 0);
        ctx.lineTo(e.w/3, -e.h/2);
        ctx.lineTo(-e.w/3, -e.h/2);
        ctx.lineTo(-e.w/2, 0);
        ctx.closePath();
        ctx.fill();
        // 中央座舱
        ctx.fillStyle = accCol;
        ctx.beginPath();
        ctx.arc(0, 0, e.w/8, 0, Math.PI*2);
        ctx.fill();
        // 顶部装饰翼
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.beginPath();
        ctx.moveTo(-e.w/6, -e.h/3);
        ctx.lineTo(0, -e.h/2 - 10);
        ctx.lineTo(e.w/6, -e.h/3);
        ctx.closePath();
        ctx.fill();
        // 10 根金色旋棒
        ctx.strokeStyle = accCol;
        ctx.lineWidth = 4;
        ctx.beginPath();
        for(let k = 0; k < 10; k++){
          const a = now + k * (Math.PI*2/10);
          ctx.moveTo(Math.cos(a)*(e.w/2+6), Math.sin(a)*(e.w/2+6));
          ctx.lineTo(Math.cos(a)*(e.w/2+18), Math.sin(a)*(e.w/2+18));
        }
        ctx.stroke();

      } else if(e.bossType === "saucer"){
        // ===== Lv2：异形飞碟 =====
        ctx.fillStyle = mainCol;
        // 下宽碟形（椭圆主体）
        ctx.beginPath();
        ctx.ellipse(0, e.h*0.15, e.w/2, e.h*0.35, 0, 0, Math.PI*2);
        ctx.fill();
        // 上方穹顶
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.beginPath();
        ctx.ellipse(0, -e.h*0.1, e.w*0.3, e.h*0.25, 0, Math.PI, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = mainCol;
        ctx.beginPath();
        ctx.ellipse(0, -e.h*0.1, e.w*0.3, e.h*0.25, 0, 0, Math.PI);
        ctx.fill();
        // 中央绿色核心
        ctx.fillStyle = accCol;
        ctx.beginPath();
        ctx.arc(0, 0, e.w/10, 0, Math.PI*2);
        ctx.fill();
        // 底部脉冲光柱（3 根）
        ctx.strokeStyle = accCol;
        ctx.lineWidth = 5;
        const pulse = Math.sin(Date.now()/150);
        for(let k = -1; k <= 1; k++){
          ctx.beginPath();
          ctx.moveTo(k*e.w*0.2, e.h*0.25);
          ctx.lineTo(k*e.w*0.2 + pulse*4, e.h*0.4);
          ctx.stroke();
        }
        // 碟边发光灯（8 颗）
        ctx.fillStyle = accCol;
        for(let k = 0; k < 8; k++){
          const a = k * (Math.PI/4);
          ctx.beginPath();
          ctx.arc(Math.cos(a)*e.w/2, Math.sin(a)*e.h*0.35 + e.h*0.15, 4+Math.sin(Date.now()/200+k)*2, 0, Math.PI*2);
          ctx.fill();
        }

      } else if(e.bossType === "mech"){
        // ===== Lv3：三角机甲 =====
        ctx.fillStyle = mainCol;
        // 主体三角
        ctx.beginPath();
        ctx.moveTo(0, e.h/2);
        ctx.lineTo(e.w/2, -e.h/3);
        ctx.lineTo(e.w/4, -e.h/2);
        ctx.lineTo(-e.w/4, -e.h/2);
        ctx.lineTo(-e.w/2, -e.h/3);
        ctx.closePath();
        ctx.fill();
        // 6 个展开侧翼（旋转）
        const flapA = now * 2;
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        for(let k = 0; k < 6; k++){
          const a = k * (Math.PI/3) + flapA;
          const fx = Math.cos(a) * e.w * 0.55;
          const fy = Math.sin(a) * e.h * 0.55;
          ctx.save();
          ctx.translate(fx, fy);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(e.w*0.2, -6);
          ctx.lineTo(e.w*0.2, 6);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        // 中央单眼
        ctx.fillStyle = accCol;
        ctx.beginPath();
        ctx.arc(0, -e.h/8, e.w/10, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(0, -e.h/8, e.w/16, 0, Math.PI*2);
        ctx.fill();
        // 黄色齿轮外环
        ctx.strokeStyle = accCol;
        ctx.lineWidth = 4;
        for(let tooth = 0; tooth < 16; tooth++){
          const a = now*3 + tooth * (Math.PI*2/16);
          const r1 = e.w*0.5 + Math.sin(a*2)*3;
          const r2 = r1 + 10;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
          ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
          ctx.stroke();
        }

      } else if(e.bossType === "crab"){
        // ===== Lv4+：深渊巨蟹 =====
        // 8 条弯曲触手
        ctx.strokeStyle = mainCol;
        ctx.lineWidth = e.w*0.12;
        ctx.lineCap = "round";
        for(let k = 0; k < 8; k++){
          const baseA = k * (Math.PI/4);
          const sway = Math.sin(Date.now()/400 + k) * 0.3;
          const dx = Math.cos(baseA);
          const dy = Math.sin(baseA);
          ctx.beginPath();
          ctx.moveTo(dx*e.w*0.3, dy*e.h*0.3);
          ctx.quadraticCurveTo(
            dx*e.w*0.6 + sway*20, dy*e.h*0.6 + sway*20,
            dx*e.w*0.8, dy*e.h*0.8
          );
          ctx.stroke();
        }
        ctx.lineCap = "butt";
        // 中央核
        ctx.fillStyle = mainCol;
        ctx.beginPath();
        ctx.arc(0, 0, e.w*0.32, 0, Math.PI*2);
        ctx.fill();
        // 核内橙色脉络
        ctx.strokeStyle = accCol;
        ctx.lineWidth = 3;
        for(let k = 0; k < 5; k++){
          const a = Date.now()/800 + k * (Math.PI*2/5);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a)*e.w*0.25, Math.sin(a)*e.h*0.25);
          ctx.stroke();
        }
        // 两只红眼
        ctx.fillStyle = "#ffff00";
        ctx.beginPath();
        ctx.arc(-e.w*0.12, -e.h*0.08, e.w*0.05, 0, Math.PI*2);
        ctx.arc(e.w*0.12, -e.h*0.08, e.w*0.05, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(-e.w*0.12, -e.h*0.08, e.w*0.025, 0, Math.PI*2);
        ctx.arc(e.w*0.12, -e.h*0.08, e.w*0.025, 0, Math.PI*2);
        ctx.fill();
        // 放射触须
        ctx.strokeStyle = accCol;
        ctx.lineWidth = 2;
        for(let k = 0; k < 12; k++){
          const a = now * 2 + k * (Math.PI/6);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a)*e.w*0.4, Math.sin(a)*e.w*0.4);
          ctx.lineTo(Math.cos(a)*(e.w*0.55 + Math.sin(a*3)*5), Math.sin(a)*(e.w*0.55 + Math.sin(a*3)*5));
          ctx.stroke();
        }
      }

      ctx.shadowBlur = 0;
      // BOSS 名字（用专属名称）
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${e.bossName || "BOSS"} Lv.${e.bossLevel}`, 0, -e.h/2 - 30);
      ctx.textAlign = "start";
    } else if(e.type === "laserDrone"){
      // 激光机：红色菱形
      ctx.beginPath();
      ctx.moveTo(0, e.h/2);
      ctx.lineTo(e.w/2, 0);
      ctx.lineTo(0, -e.h/2);
      ctx.lineTo(-e.w/2, 0);
      ctx.closePath();
      ctx.fill();
      // 预警光环
      if(e.laserPhase === 1){
        ctx.strokeStyle = `rgba(255,68,100,${0.5+Math.sin(Date.now()/60)*0.3})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, e.w*0.8, 0, Math.PI*2);
        ctx.stroke();
      } else if(e.laserPhase === 2){
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, e.w*0.9, 0, Math.PI*2);
        ctx.stroke();
      }
    } else if(e.type === "deflect"){
      // 消弹机：绿色圆 + 前方扇形口（炮口）
      ctx.beginPath();
      ctx.arc(0, 0, e.w/2, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, 0, e.w/4, 0, Math.PI*2);
      ctx.fill();
      // 前方开口指示
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(0, -e.h/2);
      ctx.lineTo(-6*S, -e.h/2 + 10*S);
      ctx.lineTo(6*S, -e.h/2 + 10*S);
      ctx.closePath();
      ctx.fill();
    } else if(e.type === "tumor"){
      // 肉瘤：亮粉巨型不规则泡泡 + 发光脉冲 + 暗色肿瘤斑块
      const now = Date.now();
      const pulse = 1 + Math.sin(now/200) * 0.05;
      ctx.save();
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 25;
      ctx.beginPath();
      const bumps = 10;
      for(let k = 0; k <= bumps; k++){
        const a = k * (Math.PI*2/bumps);
        const r = e.w/2 * pulse + Math.sin(now/250 + k*1.1)*6;
        const px = Math.cos(a)*r, py = Math.sin(a)*r;
        if(k===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      // 暗色肿瘤斑块（增强辨识度）
      ctx.fillStyle = "rgba(80,0,60,0.55)";
      ctx.beginPath();
      ctx.arc(-12*S, -8*S, 10*S, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(14*S, 10*S, 8*S, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(-4*S, 18*S, 7*S, 0, Math.PI*2); ctx.fill();
      // 白色核心（让它更醒目）
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.beginPath();
      ctx.arc(0, 0, e.w/6, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(e.type === "splitter"){
      // 分裂怪：绿色圆 + 内部代数数字
      ctx.beginPath();
      ctx.arc(0, 0, e.w/2, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.max(10, e.w/3)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(2 - e.splitGen), 0, 1);
      ctx.textBaseline = "alphabetic";
      ctx.textAlign = "start";
    } else {
      // small / medium：标准倒三角
      ctx.beginPath();
      ctx.moveTo(0, e.h / 2);
      ctx.lineTo(-e.w / 2, -e.h / 2);
      ctx.lineTo(-e.w / 4, -e.h / 3);
      ctx.lineTo(0, -e.h / 2 + 6);
      ctx.lineTo(e.w / 4, -e.h / 3);
      ctx.lineTo(e.w / 2, -e.h / 2);
      ctx.closePath();
      ctx.fill();
    }

    // 血条
    if(e.hp < e.maxHp){
      const barW = e.type === "boss" ? e.w * 1.5 : e.w;
      const barX = e.type === "boss" ? -e.w * 0.75 : -e.w/2;
      ctx.fillStyle = "#222";
      ctx.fillRect(barX, -e.h/2 - (e.type === "boss" ? 22 : 10), barW, e.type === "boss" ? 10 : 4);
      ctx.fillStyle = e.hp/e.maxHp > 0.4 ? "#51ff8a" : "#ff4444";
      ctx.fillRect(barX, -e.h/2 - (e.type === "boss" ? 22 : 10), barW * (e.hp / e.maxHp), e.type === "boss" ? 10 : 4);
    }
    ctx.restore();

    // ==== laserDrone 激光绘制（贯穿全屏幕）====
    if(e.type === "laserDrone"){
      if(e.laserPhase === 1){ // 预警
        ctx.save();
        ctx.strokeStyle = `rgba(255,68,100,${0.5+Math.sin(Date.now()/50)*0.3})`;
        ctx.setLineDash([10, 6]);
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.laserTX, e.laserTY);
        ctx.stroke();
        ctx.setLineDash([]);
        // 端点圆圈
        ctx.fillStyle = "#ff4466";
        ctx.beginPath();
        ctx.arc(e.laserTX, e.laserTY, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      } else if(e.laserPhase === 2){ // 发射
        ctx.save();
        ctx.strokeStyle = "#ff2266";
        ctx.shadowColor = "#ff2266";
        ctx.shadowBlur = 20;
        ctx.lineWidth = 10 * S;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.laserTX, e.laserTY);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3 * S;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.laserTX, e.laserTY);
        ctx.stroke();
        ctx.restore();
      }
    }

    // ==== mech 激光绘制（预警+发射，贯穿全屏幕）====
    if(e.type === "boss" && e.bossType === "mech" && e.mechLaserPhase > 0){
      const dx = e.mechLaserTX - e.x, dy = e.mechLaserTY - e.y;
      const edge = rayToEdge(e.x, e.y, dx, dy);
      if(e.mechLaserPhase === 1){ // 预警
        ctx.save();
        ctx.strokeStyle = `rgba(255,255,68,${0.4 + Math.sin(Date.now()/50)*0.3})`;
        ctx.setLineDash([10, 6]);
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(edge.x, edge.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#ffff44";
        ctx.beginPath();
        ctx.arc(edge.x, edge.y, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      } else { // 发射
        ctx.save();
        ctx.strokeStyle = e.accent || "#ffff44";
        ctx.shadowColor = e.accent || "#ffff44";
        ctx.shadowBlur = 25;
        ctx.lineWidth = 14 * S;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(edge.x, edge.y);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4 * S;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(edge.x, edge.y);
        ctx.stroke();
        ctx.restore();
      }
    }

    // ==== BOSS 光束绘制（世界坐标系，贯穿全屏幕）====
    if(e.type === "boss" && (e.beamWarn > 0 || e.beamActive > 0)){
      ctx.save();
      if(e.beamActive > 0){
        // 发射阶段：粗红光束 + 光晕 + 白芯
        ctx.strokeStyle = "#ff2244";
        ctx.shadowColor = "#ff2244";
        ctx.shadowBlur = 40;
        ctx.lineWidth = 22 * S;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.beamTX, e.beamTY);
        ctx.stroke();
        ctx.shadowBlur = 15;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 7 * S;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.beamTX, e.beamTY);
        ctx.stroke();
      } else if(e.beamWarn > 0){
        // 预警阶段：粗红警戒带 + 闪烁虚线 + 屏幕边缘大红圈
        const flash = Math.sin(Date.now()/80) > 0;
        const warnProgress = 1 - e.beamWarn / 120; // 0→1 越接近发射越醒目
        // 1) 背景红色警戒带（半透明粗带）
        ctx.strokeStyle = `rgba(255, 30, 30, ${0.15 + warnProgress * 0.25})`;
        ctx.lineWidth = 36 * S;
        ctx.lineCap = "butt";
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.beamTX, e.beamTY);
        ctx.stroke();
        // 2) 中间粗红虚线
        ctx.strokeStyle = flash ? "#ff2222" : "#aa0000";
        ctx.setLineDash([14, 10]);
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.beamTX, e.beamTY);
        ctx.stroke();
        ctx.setLineDash([]);
        // 3) BOSS 炮口处红圈
        ctx.fillStyle = flash ? "#ff3333" : "#cc0000";
        ctx.beginPath();
        ctx.arc(e.x, e.y, 14, 0, Math.PI*2);
        ctx.fill();
        // 4) 屏幕边缘瞄准点（大红圈）
        ctx.strokeStyle = flash ? "#ff3333" : "#cc0000";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(e.beamTX, e.beamTY, 18, 0, Math.PI*2);
        ctx.stroke();
        ctx.fillStyle = flash ? "#ff3333" : "#cc0000";
        ctx.beginPath();
        ctx.arc(e.beamTX, e.beamTY, 6, 0, Math.PI*2);
        ctx.fill();
        // 5) 倒计时文字
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚠ WARNING ⚠", (e.x + e.beamTX)/2, (e.y + e.beamTY)/2 - 15);
        ctx.textAlign = "start";
      }
      ctx.restore();
    }
  }
}

// ========== 道具系统 ==========
function spawnItem(x,y,forceType){
  if(forceType){
    items.push({x,y,w:18*S,h:18*S,type:forceType,t:0});
    return;
  }
  const r = Math.random();
  let type;
  if(r<0.20) type="power";
  else if(r<0.34) type="laser";
  else if(r<0.46) type="missile";
  else if(r<0.58) type="gun";
  else if(r<0.68) type="radial";
  else if(r<0.78) type="shield";
  else if(r<0.86) type="bomb";
  else type="heal";
  items.push({
    x,y,
    w:26*S,h:26*S,
    speed:2.2,
    type
  });
}

function updateItems(){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    // 磁吸：距离玩家 <140px 自动吸过去
    const dx = player.x - it.x;
    const dy = player.y - it.y;
    const dist = Math.hypot(dx, dy);
    if(dist < 140){
      const pull = dist < 50 ? 6 : 3;
      it.x += dx / dist * pull;
      it.y += dy / dist * pull;
    } else {
      it.y += it.speed;
    }
    if(it.y>canvas.height+30) items.splice(i,1);
  }
}
function drawItems(){
  for(const it of items){
    ctx.save();
    ctx.translate(it.x,it.y);
    if(it.type==="power") ctx.fillStyle="#ff4444";
    else if(it.type==="laser") ctx.fillStyle="#bb44ff";
    else if(it.type==="missile") ctx.fillStyle="#ff9922";
    else if(it.type==="gun") ctx.fillStyle="#ffdd44";
    else if(it.type==="radial") ctx.fillStyle="#ffcc33";
    else if(it.type==="shield") ctx.fillStyle="#44ff77";
    else if(it.type==="bomb") ctx.fillStyle="#ffdd44";
    else if(it.type==="heal") ctx.fillStyle="#ff4488";
    ctx.beginPath();
    ctx.arc(0,0,13,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#000";
    ctx.font="bold 16px sans-serif";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    if(it.type==="power") ctx.fillText("P",0,0);
    else if(it.type==="laser") ctx.fillText("L",0,0);
    else if(it.type==="missile") ctx.fillText("M",0,0);
    else if(it.type==="gun") ctx.fillText("G",0,0);
    else if(it.type==="radial") ctx.fillText("R",0,0);
    else if(it.type==="shield") ctx.fillText("S",0,0);
    else if(it.type==="bomb") ctx.fillText("B",0,0);
    else if(it.type==="heal") ctx.fillText("+",0,0);
    ctx.restore();
  }
}

// ========== 碰撞检测 ==========
function collides(a, b){
  // -4 缓冲对大物体没问题，但子弹(w≈3) vs 弹幕(w≈4)时 (3+4)/2-4=-0.4 永远碰撞失败！
  // 改成 -1 既保留微小缓冲防误触，又让小物体之间能正常碰撞
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 - 1 &&
         Math.abs(a.y - b.y) < (a.h + b.h) / 2 - 1;
}
function circleCollide(p1, p2, r1, r2){
  const dx = p1.x - p2.x;
  const dy = p1.y - p2.y;
  return Math.sqrt(dx*dx + dy*dy) < r1 + r2;
}

function handleCollisions(){
  //子弹 vs 敌机
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    for(let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if(collides(b, e)){
        // 激光：同一帧避免重复击中同一敌机 —— 必须在扣血之前检查！
        if(b.type === "laser"){
          if(!b.hitEnemies) b.hitEnemies = new Set();
          if(b.hitEnemies.has(e)) continue;
          if(b.hitEnemies.size > 8){
            // Set 太大就重建一下，防止内存泄漏
            b.hitEnemies = new Set([...b.hitEnemies].slice(-5));
          }
          b.hitEnemies.add(e);

          e.hp = Math.max(0, e.hp - b.damage);

          if(b.refractCount > 0){
            b.refractCount--;
            const dx = b.x - e.x;
            const dy = b.y - e.y;
            const incAngle = Math.atan2(b.vy, b.vx);
            const speed = Math.hypot(b.vx, b.vy);
            if(Math.abs(dx) > Math.abs(dy)){
              // 横向撞击：水平反弹
              b.vx = (dx > 0 ? 1 : -1) * speed * 0.9;
              b.vy = -Math.abs(b.vy) * 0.8;
            }else{
              // 纵向撞击：随机左右 ±45° 折射
              const turn = (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 4);
              const newAngle = incAngle + turn;
              b.vx = Math.cos(newAngle) * speed;
              b.vy = Math.sin(newAngle) * speed;
            }
          }
          // 激光穿透，不销毁子弹，也不 break，让内层循环继续检查下一个敌机
        }else{
          // 普通子弹 / 导弹直接扣血
          e.hp = Math.max(0, e.hp - b.damage);
          // 导弹额外范围爆炸
          if(b.type === "missile"){
            createExplosion(b.x, b.y, "#ff8822");
            for(let k = enemies.length - 1; k >= 0; k--){
              const e2 = enemies[k];
              if(e2 === e) continue;
              if(Math.hypot(e2.x - b.x, e2.y - b.y) < 45){
                e2.hp = Math.max(0, e2.hp - 0.8);
                if(e2.hp <= 0){
                  killCount++;
                  createExplosion(e2.x, e2.y, e2.color);
                  if(e2.type === "boss"){
                    onBossDefeated(e2);
                  } else {
                    player.score += e2.score;
                    if(Math.random() < e2.dropRate) spawnItem(e2.x, e2.y);
                  }
                  enemies.splice(k, 1);
                }
              }
            }
          }

          // 主目标死亡处理
          if(e.hp <= 0){
            killCount++;
            createExplosion(e.x, e.y, e.color);
            if(e.type === "boss"){
              // 巨蟹分裂：第一次死→分裂；第二次→真死
              if(e.bossType === "crab" && e.splitStage < 1){
                for(let si = 0; si < 2; si++){
                  enemies.push({
                    type: "boss", bossType: "crab", bossName: "巨蟹残体",
                    x: e.x + (si===0?-e.w*0.3:e.w*0.3), y: e.y,
                    w: e.w*0.6, h: e.h*0.6,
                    hp: Math.ceil(e.maxHp * 0.5), maxHp: Math.ceil(e.maxHp * 0.5),
                    speed: 1.0, color: e.color, accent: e.accent,
                    score: Math.ceil(e.score * 0.5),
                    dropRate: 1.0, bossLevel: e.bossLevel,
                    phase: "fight", shootTimer: 0, shootInterval: 60,
                    pattern: 0, patternTimer: 0, spiralAngle: 0,
                    moveTimer: 0, targetX: e.x + (si===0?-80:80),
                    beamTimer: 9999, beamWarn: 0, beamActive: 0,
                    splitStage: e.splitStage + 1,
                    crabOrbTimer: 60,
                    // 无 mech 字段，无 purge 能力
                  });
                }
              } else {
                onBossDefeated(e);
              }
            } else if(e.type === "splitter" && e.splitGen < 2){
              // 分裂怪：一分为二，体积变小，最多分裂2代（原始+子+孙=3代）
              for(let si = 0; si < 2; si++){
                enemies.push({
                  type: "splitter",
                  x: e.x + (si===0?-15:15)*S,
                  y: e.y,
                  w: e.w * 0.6, h: e.h * 0.6,
                  color: shadeColor("#aadd66", 0),
                  hp: Math.ceil(e.maxHp * 0.6), maxHp: Math.ceil(e.maxHp * 0.6),
                  speed: 1.4 + e.splitGen*0.2,
                  score: 40,
                  dropRate: 0.15,
                  splitGen: e.splitGen + 1,
                });
              }
              player.score += e.score;
            } else {
              player.score += e.score;
              if(Math.random() < e.dropRate) spawnItem(e.x, e.y);
            }
            enemies.splice(j, 1);
          }
          bullets.splice(i, 1);
          break;
        }

        // 激光的穿透式死亡处理（激光没有 break，会穿透继续检查下一个敌机）
        if(e.hp <= 0){
          killCount++;
          createExplosion(e.x, e.y, e.color);
          if(e.type === "boss"){
            if(e.bossType === "crab" && e.splitStage < 1){
              for(let si = 0; si < 2; si++){
                enemies.push({
                  type: "boss", bossType: "crab", bossName: "巨蟹残体",
                  x: e.x + (si===0?-e.w*0.3:e.w*0.3), y: e.y,
                  w: e.w*0.6, h: e.h*0.6,
                  hp: Math.ceil(e.maxHp * 0.5), maxHp: Math.ceil(e.maxHp * 0.5),
                  speed: 1.0, color: e.color, accent: e.accent,
                  score: Math.ceil(e.score * 0.5),
                  dropRate: 1.0, bossLevel: e.bossLevel,
                  phase: "fight", shootTimer: 0, shootInterval: 60,
                  pattern: 0, patternTimer: 0, spiralAngle: 0,
                  moveTimer: 0, targetX: e.x + (si===0?-80:80),
                  beamTimer: 9999, beamWarn: 0, beamActive: 0,
                  splitStage: e.splitStage + 1,
                  crabOrbTimer: 60,
                });
              }
            } else {
              onBossDefeated(e);
            }
          } else if(e.type === "splitter" && e.splitGen < 2){
            for(let si = 0; si < 2; si++){
              enemies.push({
                type: "splitter",
                x: e.x + (si===0?-15:15)*S,
                y: e.y,
                w: e.w * 0.6, h: e.h * 0.6,
                color: shadeColor("#aadd66", 0),
                hp: Math.ceil(e.maxHp * 0.6), maxHp: Math.ceil(e.maxHp * 0.6),
                speed: 1.4 + e.splitGen*0.2,
                score: 40,
                dropRate: 0.15,
                splitGen: e.splitGen + 1,
              });
            }
            player.score += e.score;
          } else {
            player.score += e.score;
            if(Math.random() < e.dropRate) spawnItem(e.x, e.y);
          }
          enemies.splice(j, 1);
        }
      }
    }
  }

  // ===== 玩家子弹 清弹：打掉敌方弹幕 =====
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if(b.type === "laser" || b.type === "bomber") continue;
    for(let k = enemyBullets.length - 1; k >= 0; k--){
      const eb = enemyBullets[k];
      if(eb.isBossBullet) continue;
      if(collides(b, eb)){
        enemyBullets.splice(k, 1);
        if(b.type === "missile") player.score += 5;
        break;
      }
    }
  }

  // ===== deflect 弧形弹 反向清我方弹幕 =====
  for(let k = enemyBullets.length - 1; k >= 0; k--){
    const eb = enemyBullets[k];
    if(!eb.isDeflect) continue;
    for(let i = bullets.length - 1; i >= 0; i--){
      const b = bullets[i];
      if(b.type === "laser") continue; // 激光太粗让它穿过去
      if(collides(b, eb)){
        // 互相抵消
        enemyBullets.splice(k, 1);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  //拾取道具（带等级上限！）
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(collides(player,it)){
      totalPickCount++;
      if(it.type==="power" && player.power < 5) player.power++;
      else if(it.type==="laser" && player.laser < 3) player.laser++;
      else if(it.type==="missile" && player.missile < 8) player.missile++;
      else if(it.type==="gun" && player.gun < 3) player.gun++;
      else if(it.type==="radial" && player.radial < 6) player.radial++;
      else if(it.type==="shield") player.shield=true;
      else if(it.type==="bomb") player.bomb++;
      else if(it.type==="heal"){
        if(player.hp<player.maxHp) player.hp++;
      }
      items.splice(i,1);
    }
  }

  //敌机子弹击中玩家
  for(let i = enemyBullets.length -1; i >=0; i--){
    const eb = enemyBullets[i];
    if(player.invincible>0) continue;
    if(circleCollide(player, eb, 20, 5)){
      enemyBullets.splice(i,1);
      if(player.shield){
        player.shield = false;
      }else if(player.hp === 1){
        // 最后一滴血：尝试降级保命
        const ups = [];
        if(player.power > 1) ups.push("power");
        if(player.laser > 0) ups.push("laser");
        if(player.missile > 0) ups.push("missile");
        if(player.gun > 0) ups.push("gun");
        if(player.radial > 0) ups.push("radial");
        if(ups.length > 0){
          // 有升级可降 → 降级 2 项保命（仁慈机制）
          player.invincible = 90;
          for(let k=0; k<2 && ups.length>0; k++){
            const pickIdx = Math.floor(Math.random()*ups.length);
            player[ups[pickIdx]]--;
            ups.splice(pickIdx, 1);
          }
        }else{
          // 没升级可降 → 老实扣血死亡
          player.hp--;
          player.invincible = 60;
        }
      }else{
        player.hp--;
        player.invincible = 60;
        const ups = [];
        if(player.power > 1) ups.push("power");
        if(player.laser > 0) ups.push("laser");
        if(player.missile > 0) ups.push("missile");
        if(player.gun > 0) ups.push("gun");
        if(player.radial > 1) ups.push("radial"); // 保底 1 根，最后一根不降级
        if(ups.length > 0){
          const pick = ups[Math.floor(Math.random()*ups.length)];
          player[pick]--;
        }
      }
    }
  }

  // drone 自杀冲撞机体（直接撞玩家）
  for(let j = enemies.length - 1; j >= 0; j--){
    const e = enemies[j];
    if(!e.drone) continue;
    if(player.invincible > 0) continue;
    if(circleCollide(player, e, 22, 14)){
      createExplosion(e.x, e.y, e.color);
      enemies.splice(j, 1);
      if(player.shield){
        player.shield = false;
      }else if(player.hp <= 2){
        const ups = [];
        if(player.power > 1) ups.push("power");
        if(player.laser > 0) ups.push("laser");
        if(player.missile > 0) ups.push("missile");
        if(player.gun > 0) ups.push("gun");
        if(player.radial > 1) ups.push("radial"); // 保底 1 根
        if(ups.length > 0){
          player.invincible = 90;
          for(let k=0; k<2 && ups.length>0; k++){
            const pickIdx = Math.floor(Math.random()*ups.length);
            player[ups[pickIdx]]--;
            ups.splice(pickIdx, 1);
          }
        }else{
          player.hp -= 2;
          player.invincible = 90;
        }
      }else{
        player.hp -= 2;
        player.invincible = 90;
      }
    }
  }
}

function useBomb(){
  // 只清弹幕：敌方所有弹幕（包括 BOSS 的）+ 玩家子弹
  for(const eb of enemyBullets){
    createExplosion(eb.x, eb.y, "#ffcc00");
  }
  enemyBullets.length=0;
  bullets.length=0;
}

function createExplosion(x, y, color){
  // 硬上限 800，粒子不清理会撑爆浏览器！
  if(explosions.length > 800) explosions.splice(0, explosions.length - 800);
  for(let i = 0; i < 24; i++){
    explosions.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function updateExplosions(){
  for(let i = explosions.length - 1; i >= 0; i--){
    const p = explosions[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if(p.life <= 0){
      explosions.splice(i, 1);
    }
  }
}

function drawExplosions(){
  for(const p of explosions){
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

//中文UI
function drawUI(){
  ctx.fillStyle="#fff";
  ctx.font="bold 18px sans-serif";
  ctx.textAlign="left";
  ctx.fillText(`得分：${player.score}`,20,30);
  ctx.fillText(`普通火力：${player.power}`,20,52);
  ctx.fillText(`激光：${player.laser}(穿透折射)`,20,74);
  ctx.fillText(`追踪导弹：${player.missile}(自动追踪)`,20,96);
  ctx.fillText(`机关枪：${player.gun}(扇形弹幕)`,20,118);
  ctx.fillText(`旋转弹幕：${player.radial}(旋转清弹)`,20,140);
  ctx.fillText(`炸弹：${player.bomb}`,20,162);
  ctx.fillText(`护盾：${player.shield?"开启":"关闭"}`,20,184);
  ctx.fillText(`血量：${player.hp}/${player.maxHp}`,20,206);
  ctx.fillText(`拾取总数：${totalPickCount}`,20,228);

  if(player.hp <=0){
    ctx.fillStyle="#fff";
    ctx.font="bold 44px sans-serif";
    ctx.textAlign="center";
    ctx.fillText("游戏结束", canvas.width/2, canvas.height/2-80);
    //=====新增结算面板：总分 + 击杀敌人数量=====
    ctx.font="bold 28px sans-serif";
    ctx.fillText(`最终得分：${player.score}`, canvas.width/2, canvas.height/2-20);
    ctx.fillText(`击败敌机：${killCount} 架`, canvas.width/2, canvas.height/2+20);

    ctx.fillStyle="#2277dd";
    ctx.fillRect(canvas.width/2-110, canvas.height/2+60,220,50);
    ctx.fillStyle="#fff";
    ctx.font="bold 24px sans-serif";
    ctx.fillText("重新开始", canvas.width/2, canvas.height/2+91);
  }
}

function drawStartSelection(){
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  // 标题
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 42px sans-serif";
  ctx.textAlign = "center";
  ctx.shadowColor = "#44aaff";
  ctx.shadowBlur = 15;
  ctx.fillText("星空战机", cx, cy - 180);
  ctx.shadowBlur = 0;

  ctx.font = "bold 20px sans-serif";
  ctx.fillStyle = "#88ccff";
  ctx.fillText("开局自选一项强化道具", cx, cy - 130);

  // 3 个按钮横向排布
  const btnW = Math.min(200, (canvas.width - 80) / 3 - 15);
  const btnH = 220;
  const gap = (canvas.width - btnW * 3) / 4;
  const btnY = cy - 40;
  startBtnRects = [];

  for(let k = 0; k < 3; k++){
    const bx = gap + k * (btnW + gap);
    startBtnRects.push({x:bx, y:btnY, w:btnW, h:btnH, type:startOptions[k].type});
    const opt = startOptions[k];

    // 按钮背景（圆角矩形）
    ctx.save();
    ctx.shadowColor = opt.color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = "rgba(30, 30, 50, 0.85)";
    roundRect(ctx, bx, btnY, btnW, btnH, 16);
    ctx.fill();
    ctx.strokeStyle = opt.color;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 道具图标（大圆）
    ctx.fillStyle = opt.color;
    ctx.beginPath();
    ctx.arc(bx + btnW/2, btnY + 60, 34, 0, Math.PI*2);
    ctx.fill();
    // 图标字母
    ctx.fillStyle = "#000";
    ctx.font = "bold 30px sans-serif";
    ctx.textBaseline = "middle";
    const letterMap = {power:"P",laser:"L",missile:"M",gun:"G",bomb:"B",shield:"S",heal:"+"};
    ctx.fillText(letterMap[opt.type] || "?", bx + btnW/2, btnY + 60);
    ctx.textBaseline = "alphabetic";

    // 名称
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(opt.label, bx + btnW/2, btnY + 125);
    // 说明
    ctx.fillStyle = "#cccccc";
    ctx.font = "14px sans-serif";
    ctx.fillText(opt.desc, bx + btnW/2, btnY + 155);
    ctx.restore();
  }

  // 底部提示
  ctx.fillStyle = "#888";
  ctx.font = "14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("点击任一选项开始游戏", cx, btnY + btnH + 40);
  ctx.textAlign = "start";
}

// 圆角矩形辅助
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function applyStartOption(type){
  switch(type){
    case "power":  player.power = Math.min(5, player.power + 1); break;
    case "laser":  player.laser = Math.min(3, player.laser + 1); break;
    case "missile":player.missile = Math.min(8, player.missile + 2); break;
    case "gun":    player.gun = Math.min(3, player.gun + 1); break;
    case "bomb":   player.bomb = Math.min(5, player.bomb + 2); break;
    case "shield": player.shield = true; break;
    case "heal":   player.maxHp++; player.hp = player.maxHp; break;
  }
  startSelection = false;
}

function loop(){
  ctx.fillStyle = "#000814";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ==== 开局选择阶段：只显示星空+选择界面 ====
  updateStars();
  drawStars();

  if(startSelection){
    drawStartSelection();
    requestAnimationFrame(loop);
    return;
  }

  if(player.hp <= 0){
    drawUI();
    requestAnimationFrame(loop);
    return;
  }

  updatePlayer();
  updateBullets();
  updateEnemies();
  updateEnemyBullets();   // ← 敌方弹幕位置更新完毕
  clearBulletsByRadial(); // ← 这里扫弹！用最新位置 ✅
  updateItems();

  // ===== 炸弹自动补充（<2 个时 15 秒 +1）=====
  if(player.bomb < 2){
    bombAutoTimer--;
    if(bombAutoTimer <= 0){
      player.bomb++;
      bombAutoTimer = 900;
    }
  } else {
    bombAutoTimer = 900;
  }

  handleCollisions();
  updateExplosions();

  drawBullets();
  drawEnemies();
  drawEnemyBullets();
  drawRadial();
  drawItems();
  drawExplosions();
  drawPlayer();
  drawUI();

  requestAnimationFrame(loop);
}

window.onload = function(){
  loop();
}
</script>
