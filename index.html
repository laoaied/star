<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星空战机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;
  touch-action:none;-webkit-touch-callout:none;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
canvas{display:block;touch-action:none;}
/* 虚拟炸弹按钮 */
#bombBtn{
  position:fixed;right:24px;bottom:24px;
  width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle,#ff6600,#cc2200);
  border:3px solid #ffcc00;color:#fff;
  font-size:13px;font-weight:bold;
  display:none;align-items:center;justify-content:center;
  z-index:100;box-shadow:0 0 16px rgba(255,100,0,0.7);
  -webkit-tap-highlight-color:transparent;
  transition:transform 0.1s;
}
#bombBtn:active{transform:scale(0.92);}
/* 移动端显示炸弹按钮 */
@media (hover:none) and (pointer:coarse){
  #bombBtn{display:flex;}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="bombBtn">💣<br>炸弹</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ========== 输入控制 ==========
const keys = {};
const mouse = { x: canvas.width / 2, y: canvas.height - 120, active: false };

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if(e.code === "Space" && player && player.bomb > 0 && player.hp>0){
    useBomb();
    player.bomb --;
  }
});
window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  mouse.active = true;
});

canvas.addEventListener("click",e=>{
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  // 开局选择阶段：检测 3 个按钮
  if(startSelection){
    for(const btn of startBtnRects){
      if(cx >= btn.x && cx <= btn.x + btn.w && cy >= btn.y && cy <= btn.y + btn.h){
        applyStartOption(btn.type);
        return;
      }
    }
    return;
  }

  // 游戏结束：重新开始按钮
  if(player && player.hp <=0){
    const bx = canvas.width/2;
    const by = canvas.height/2 + 60;
    if(cx > bx-110 && cx < bx+110 && cy>by-30 && cy<by+30){
      resetGame();
    }
  }
})

// ========== 触摸控制 ==========
canvas.addEventListener("touchstart", e=>{
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const tx = t.clientX - rect.left;
  const ty = t.clientY - rect.top;

  // 开局选择阶段：触摸也能选
  if(startSelection){
    for(const btn of startBtnRects){
      if(tx >= btn.x && tx <= btn.x + btn.w && ty >= btn.y && ty <= btn.y + btn.h){
        applyStartOption(btn.type);
        return;
      }
    }
    return;
  }

  mouse.x = tx;
  mouse.y = ty;
  mouse.active = true;
}, {passive:false});

canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  mouse.x = t.clientX - rect.left;
  mouse.y = t.clientY - rect.top;
  mouse.active = true;
}, {passive:false});

canvas.addEventListener("touchend", e=>{
  e.preventDefault();
  // 触摸结束后战机停在原地（不像鼠标那样还能悬空）
  // mouse.active 保持 true，这样玩家可以触摸别处继续控制
}, {passive:false});

// 虚拟炸弹按钮
const bombBtn = document.getElementById("bombBtn");
bombBtn.addEventListener("touchstart", e=>{
  e.preventDefault();
  if(player && player.bomb > 0 && player.hp>0){
    useBomb();
    player.bomb--;
  }
}, {passive:false});
bombBtn.addEventListener("click", ()=>{
  if(player && player.bomb > 0 && player.hp>0){
    useBomb();
    player.bomb--;
  }
});

// ========== 辅助：判断是否移动端 ==========
const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
// 手机端整体缩小系数：敌机/玩家/子弹 w/h 全部 × 这个
const S = isMobile ? 0.72 : 1;

// ========== 星空背景 ==========
const stars = [];
for(let i = 0; i < 200; i++){
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    s: Math.random() * 2 + 0.5,
    v: Math.random() * 1.5 + 0.5
  });
}

function updateStars(){
  for(const s of stars){
    s.y += s.v;
    if(s.y > canvas.height){
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  }
}

function drawStars(){
  for(const s of stars){
    ctx.fillStyle = `rgba(255,255,255, ${0.3 + s.s * 0.2})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
}

// ========== 玩家数据 & 重置函数 ==========
let player;
let totalPickCount = 0;
let bullets = [];
let enemies = [];
let enemyBullets = [];
let items = [];
let explosions = [];
let enemyTimer = 0;
let killCount = 0;
let baseSpawnRate = 70;
let bossCount = 0;      // 累计出现过几次 BOSS
let bossCooldown = 2400;
let bombAutoTimer = 900;
// ===== 开局自选道具系统 =====
let startSelection = true;  // true=等待玩家选道具
let startOptions = [];      // [{type, label, color, desc}] 随机 3 个
let startBtnRects = [];     // [{x,y,w,h,type}] 按钮矩形（用于点击检测）

// 生成 3 个随机可选道具（从 7 种里抽，保证有火力/激光/导弹/机枪/炸弹/护盾/血量 各有出现机会）
function rollStartOptions(){
  const pool = [
    {type:"power",  label:"火力强化",   color:"#ff4444", desc:"普通子弹+1"},
    {type:"laser",  label:"激光炮",     color:"#bb44ff", desc:"扇形激光+1"},
    {type:"missile",label:"追踪导弹",   color:"#ff9922", desc:"导弹+2（自动追踪）"},
    {type:"gun",    label:"机关枪",     color:"#ffdd44", desc:"扇形散射+1"},
    {type:"bomb",   label:"紧急炸弹",   color:"#44ff88", desc:"炸弹+2（清弹幕）"},
    {type:"shield", label:"能量护盾",   color:"#44aaff", desc:"开局自带护盾"},
    {type:"heal",   label:"生命恢复",   color:"#ff4488", desc:"满血+上限+1"},
  ];
  // Fisher-Yates 抽 3 个
  startOptions = [];
  const copy = pool.slice();
  for(let k = 0; k < 3; k++){
    const idx = Math.floor(Math.random() * copy.length);
    startOptions.push(copy.splice(idx, 1)[0]);
  }
}

function resetGame(){
  player = {
    x: canvas.width / 2,
    y: canvas.height - 120,
    w: 44 * S,
    h: 44 * S,
    speed: 6,
    cooldown: 0,
    fireRate: 8,
    power: 1,
    laser: 0,
    missile: 0,
    gun: 0,
    bomb: 1,
    shield: false,
    hp: 3,
    maxHp: 3,
    invincible: 0,
    wingmen: [],
    radial: 1,        // 开局自带一根旋转半径
    radialAngle: 0,
    score: 0
  };
  totalPickCount = 0;
  baseSpawnRate = 70;
  enemies.length = 0;
  enemyBullets.length = 0;
  items.length = 0;
  explosions.length = 0;
  bullets.length = 0;
  enemyTimer = 0;
  killCount = 0;
  bossCount = 0;
  bossCooldown = 2400; // 每 40 秒出一个
  bombAutoTimer = 900;
  mouse.active = false;
  startSelection = true;
  rollStartOptions();
}
resetGame();

// 根据 radial 等级返回根数和转速
function getRadialConfig(lv){
  if(lv <= 0) return { count: 0, speed: 0 };
  const table = [
    null,                           // lv0
    { count: 1, speed: 0.04 },      // lv1  1根，基础转速
    { count: 2, speed: 0.04 },      // lv2  +1根
    { count: 2, speed: 0.06 },      // lv3  加速
    { count: 3, speed: 0.06 },      // lv4  +1根（最多3根）
    { count: 3, speed: 0.08 },      // lv5  加速
    { count: 3, speed: 0.09 },      // lv6  封顶
  ];
  return table[Math.min(lv, 6)];
}

function updatePlayer(){
  // 旋转半径：只推进角度（清弹移到主循环 updateEnemyBullets 之后做）
  const rc = getRadialConfig(player.radial);
  if(rc.count > 0) player.radialAngle += rc.speed;

  updateWingmen();

  if(mouse.active){
    player.x += (mouse.x - player.x) * 0.25;
    player.y += (mouse.y - player.y) * 0.25;
  } else {
    if(keys["arrowleft"] || keys["a"]) player.x -= player.speed;
    if(keys["arrowright"] || keys["d"]) player.x += player.speed;
    if(keys["arrowup"] || keys["w"]) player.y -= player.speed;
    if(keys["arrowdown"] || keys["s"]) player.y += player.speed;
  }

  player.x = Math.max(player.w / 2, Math.min(canvas.width - player.w / 2, player.x));
  player.y = Math.max(player.h / 2, Math.min(canvas.height - player.h / 2, player.y));

  if(player.invincible > 0) player.invincible--;

  player.cooldown++;
  let fr = player.fireRate - player.gun*1.2;
  if(fr<2) fr=2;
  if(player.cooldown >= fr){
    player.cooldown = 0;

    // 普通子弹
    if(player.power === 1){
      bullets.push({x:player.x,y:player.y-20,w:4*S,h:14*S,speed:12,damage:1,type:"normal"});
    }else if(player.power ===2){
      bullets.push({x:player.x-12,y:player.y-16,w:4*S,h:14*S,speed:12,damage:1,type:"normal"});
      bullets.push({x:player.x+12,y:player.y-16,w:4*S,h:14*S,speed:12,damage:1,type:"normal"});
    }else if(player.power >=3){
      bullets.push({x:player.x,y:player.y-20,w:4*S,h:14*S,speed:12,damage:1,type:"normal"});
      bullets.push({x:player.x-14,y:player.y-16,w:4*S,h:14*S,speed:12,damage:1, vx:-0.8,type:"normal"});
      bullets.push({x:player.x+14,y:player.y-16,w:4*S,h:14*S,speed:12,damage:1, vx:0.8,type:"normal"});
    }

    // ===== 机关枪Gun：扇形弹幕，等级越高子弹越多 =====
    if(player.gun>0){
      const bulletCount = player.gun * 2 + 1;
      const angleRange = Math.PI / 3;
      for(let i=0;i<bulletCount;i++){
        const angle = -Math.PI/2 - angleRange/2 + angleRange/(bulletCount-1)*i;
        const spd = 10;
        bullets.push({
          x:player.x, y:player.y-20,
          vx: Math.cos(angle)*spd,
          vy: Math.sin(angle)*spd,
          w:3*S,h:3*S,damage:0.4,type:"gun"
        });
      }
    }

    // ===== 追踪导弹：一定范围内追踪弹幕/敌机 =====
    for(let i=0;i<player.missile;i++){
      const offset = (i - (player.missile-1)/2)*14;
      bullets.push({
        x:player.x+offset,y:player.y-18,
        vx:0, vy:-7,
        w:6*S,h:10*S,speed:5,damage:1.2,type:"missile",turnSpeed:0.05
      });
    }
  }

  // ===== 激光：扇形发射，等级越高张角越大 =====
  if(player.laser>0){
    const laserCount = player.laser;
    const totalAngle = laserCount * 0.22; // 每级张角 +0.22rad（≈12.6°）
    for(let i=0;i<laserCount;i++){
      const t = laserCount === 1 ? 0 : (i/(laserCount-1)) - 0.5;
      const ang = -Math.PI/2 + t * totalAngle;
      const spd = 14;
      bullets.push({
        x:player.x, y:player.y-20,
        vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
        w:3*S, h:30*S, damage:0.08, type:"laser",
        pierce:true, refractCount:3, hitEnemies:new Set()
      });
    }
  }
}

function updateWingmen(){
  const targetCount = Math.min(player.missile, 6);
  // 数量不够就加
  while(player.wingmen.length < targetCount){
    const idx = player.wingmen.length;
    const side = (idx % 2 === 0 ? 1 : -1) * (1 + Math.floor(idx/2) * 1.2);
    player.wingmen.push({
      side,         // 左右位置系数
      angle: 0,     // 环绕角度
      cooldown: 0
    });
  }
  // 数量多了就减
  while(player.wingmen.length > targetCount) player.wingmen.pop();

  // 僚机环绕+跟随移动
  for(const w of player.wingmen){
    w.angle += 0.03;
    const orbitR = 50;
    const idealX = player.x + Math.cos(w.angle) * orbitR * (w.side > 0 ? 1 : -1) + w.side * 20;
    const idealY = player.y + Math.sin(w.angle) * 15 - 5;
    w.x = w.x !== undefined ? w.x + (idealX - w.x) * 0.15 : idealX;
    w.y = w.y !== undefined ? w.y + (idealY - w.y) * 0.15 : idealY;
    // 僚机开火
    w.cooldown++;
    // 僚机 150 帧一发（2.5秒），降低子弹密度
    if(w.cooldown >= 150){
      w.cooldown = 0;
      bullets.push({
        x: w.x, y: w.y - 12,
        vx: 0, vy: -5,
        w: 4*S, h: 8*S, speed: 5, damage: 0.8, type: "missile", turnSpeed: 0.04
      });
    }
  }
}

function drawWingman(w){
  ctx.save();
  ctx.translate(w.x, w.y);
  // 小机身
  ctx.fillStyle = "#ff9933";
  ctx.beginPath();
  ctx.moveTo(0, -10);
  ctx.lineTo(-8, 8);
  ctx.lineTo(0, 5);
  ctx.lineTo(8, 8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ffff66";
  ctx.beginPath();
  ctx.arc(0, -2, 2, 0, Math.PI*2);
  ctx.fill();
  // 尾焰
  ctx.fillStyle = "#ff4400";
  ctx.beginPath();
  ctx.moveTo(-3, 8);
  ctx.lineTo(0, 14 + Math.random()*3);
  ctx.lineTo(3, 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  // 先画僚机（在主机下面）
  for(const w of player.wingmen) drawWingman(w);

  ctx.save();
  ctx.translate(player.x, player.y);
  if(player.invincible>0 && Math.floor(player.invincible/4)%2===0){
    ctx.restore();
    return;
  }

  if(player.shield){
    ctx.strokeStyle="#5cf";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,0,32,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle="rgba(80,200,255,0.08)";
    ctx.fill();
  }

  const p = player.power;
  const scale = 1 + (p-1) * 0.12; // power 越大机身越大

  // ======== 升级后炫酷外观 ========
  // power>=2：加大机翼（三角形大翼）
  if(p >= 2){
    ctx.fillStyle = player.gun > 0 ? "#ffcc33" : "#3aa8ff";
    ctx.beginPath();
    ctx.moveTo(-30*scale, 10);
    ctx.lineTo(-14, -5);
    ctx.lineTo(-14, 14);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(30*scale, 10);
    ctx.lineTo(14, -5);
    ctx.lineTo(14, 14);
    ctx.closePath();
    ctx.fill();
  }

  // power>=3：翼尖加导弹挂架
  if(p >= 3){
    ctx.fillStyle = player.missile > 0 ? "#ff8822" : "#777";
    ctx.fillRect(-34*scale, 6, 6, 10);
    ctx.fillRect(28*scale, 6, 6, 10);
  }

  // laser>0：机身紫色发光描边
  if(player.laser > 0){
    ctx.shadowColor = "#cc66ff";
    ctx.shadowBlur = 15 + player.laser * 4;
  }

  // 主机身
  ctx.fillStyle = player.laser > 0 ? "#aa88ff" : (player.gun > 0 ? "#ffdd55" : "#5ad8ff");
  ctx.beginPath();
  ctx.moveTo(0, -24*scale);
  ctx.lineTo(-16*scale, 16);
  ctx.lineTo(-7, 10);
  ctx.lineTo(0, 16);
  ctx.lineTo(7, 10);
  ctx.lineTo(16*scale, 16);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // 座舱
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(0, -2, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#88ddff";
  ctx.beginPath();
  ctx.arc(0, -2, 3, 0, Math.PI * 2);
  ctx.fill();

  // power>=4：座舱光环
  if(p >= 4){
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -2, 8, 0, Math.PI*2);
    ctx.stroke();
  }

  // power>=5：机身再加顶部装饰翼
  if(p >= 5){
    ctx.fillStyle = "#ff4488";
    ctx.beginPath();
    ctx.moveTo(-4, -20);
    ctx.lineTo(0, -30);
    ctx.lineTo(4, -20);
    ctx.closePath();
    ctx.fill();
  }

  // 尾焰
  const flameLen = 12 + (player.gun + player.laser + player.missile) * 2;
  ctx.fillStyle = "#ffb020";
  ctx.beginPath();
  ctx.moveTo(-6, 18);
  ctx.lineTo(0, 18 + flameLen + Math.random()*4);
  ctx.lineTo(6, 18);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ff6600";
  ctx.beginPath();
  ctx.moveTo(-3, 18);
  ctx.lineTo(0, 18 + flameLen*0.6 + Math.random()*3);
  ctx.lineTo(3, 18);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ========== 旋转半径清弹器 ==========
function drawRadial(){
  const rc = getRadialConfig(player.radial);
  if(rc.count === 0) return;
  const cx = player.x, cy = player.y;
  const L = 200 * S;
  const RADIAL_WIDTH = 8;
  ctx.save();
  for(let k = 0; k < rc.count; k++){
    const ang = player.radialAngle + k * (Math.PI * 2 / rc.count);
    const ex = cx + Math.cos(ang) * L;
    const ey = cy + Math.sin(ang) * L;
    // 外发光
    ctx.strokeStyle = "rgba(255,220,100,0.25)";
    ctx.lineWidth = RADIAL_WIDTH * 2.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    // 主体
    ctx.strokeStyle = "#ffdd66";
    ctx.lineWidth = RADIAL_WIDTH;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    // 内芯（更亮的一条）
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    // 端点小球
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(ex, ey, 3.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// 射线→屏幕边缘交点（让光束贯穿整个屏幕）
function rayToEdge(x, y, dx, dy){
  let tMin = Infinity;
  if(dx > 0) tMin = Math.min(tMin, (canvas.width - x) / dx);
  else if(dx < 0) tMin = Math.min(tMin, (0 - x) / dx);
  if(dy > 0) tMin = Math.min(tMin, (canvas.height - y) / dy);
  else if(dy < 0) tMin = Math.min(tMin, (0 - y) / dy);
  if(!isFinite(tMin)) tMin = 1000;
  return { x: x + dx * tMin, y: y + dy * tMin };
}

// 点到线段距离（碰撞核心）
function distPointToSegment(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  if(len2 === 0) return Math.hypot(px-x1, py-y1);
  let t = ((px-x1)*dx + (py-y1)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.hypot(px-cx, py-cy);
}

// 半径清弹：每帧检查所有敌方弹幕，碰到半径就清掉
function clearBulletsByRadial(){
  const rc = getRadialConfig(player.radial);
  if(rc.count === 0) return;
  const cx = player.x, cy = player.y;
  const L = 200 * S;   // 和 drawRadial 里的 L 保持一致！碰撞=视觉
  const RAD_WIDTH = 8;
  for(let k = 0; k < rc.count; k++){
    const ang = player.radialAngle + k * (Math.PI * 2 / rc.count);
    const ex = cx + Math.cos(ang) * L;
    const ey = cy + Math.sin(ang) * L;
    // 倒序遍历 splice 安全
    for(let i = enemyBullets.length - 1; i >= 0; i--){
      const eb = enemyBullets[i];
      if(eb.isBossBullet) continue; // BOSS 弹幕不可清
      const ebR = 6; // 敌方弹幕半径（估计值，稍大更好命中）
      const d = distPointToSegment(eb.x, eb.y, cx, cy, ex, ey);
      if(d < RAD_WIDTH + ebR){
        enemyBullets.splice(i, 1);
        player.score += 5;
        // 秒杀特效：更大的爆炸 + 粒子
        createExplosion(eb.x, eb.y, "#ffcc33");
      }
    }
  }
}

// ========== 玩家子弹更新逻辑 ==========
function updateBullets(){
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if(b.type==="missile"){
      // ===== 导弹：一定范围内追踪目标（敌方弹幕优先 → 敌机次之） =====
      const TRACK_RANGE = 260 * S;
      let target = null;
      let minD = TRACK_RANGE;
      // 先找最近的敌方弹幕（清弹优先，但跳过 BOSS 弹幕）
      for(const eb of enemyBullets){
        if(eb.isBossBullet) continue;
        const d = Math.hypot(eb.x - b.x, eb.y - b.y);
        if(d < minD){ minD = d; target = eb; }
      }
      // 弹幕没找到再找敌机
      if(!target){
        for(const e of enemies){
          const d = Math.hypot(e.x - b.x, e.y - b.y);
          if(d < minD){ minD = d; target = e; }
        }
      }
      if(target){
        const targetAngle = Math.atan2(target.y - b.y, target.x - b.x);
        const currentAngle = Math.atan2(b.vy, b.vx);
        let delta = targetAngle - currentAngle;
        while(delta > Math.PI) delta -= Math.PI*2;
        while(delta < -Math.PI) delta += Math.PI*2;
        const turn = Math.min(b.turnSpeed||0.05, Math.max(-(b.turnSpeed||0.05), delta));
        const newAng = currentAngle + turn;
        b.vx = Math.cos(newAng)*b.speed;
        b.vy = Math.sin(newAng)*b.speed;
      }
      // 范围外 / 没目标：保持当前方向直行
      b.x += b.vx;
      b.y += b.vy;
      // 导弹尾焰粒子：15% 概率 + 限长
      if(Math.random() > 0.85 && explosions.length < 600){
        explosions.push({
          x: b.x - b.vx * 0.3,
          y: b.y - b.vy * 0.3,
          vx: (Math.random()-0.5)*1.2,
          vy: (Math.random()-0.5)*1.2,
          life: 0.45,
          decay: 0.05,
          color: "#ff6600",
          size: Math.random()*2 + 1
        });
      }
    }else if(b.type === "gun"){
      b.x += b.vx;
      b.y += b.vy;
    }else if(b.type === "laser"){
      b.x += b.vx;
      b.y += b.vy;
      // 速度保持恒定（扇形激光需要持续归一化 vx/vy）
      const spd = Math.hypot(b.vx, b.vy);
      if(spd > 0){
        b.vx = b.vx / spd * 14;
        b.vy = b.vy / spd * 14;
      }
      // 出界时销毁
      if(b.y < -30 || b.x < -20 || b.x > canvas.width+20 || b.y > canvas.height+20){
        bullets.splice(i, 1);
        continue;
      }
      // 同帧击中敌机后重置 hitEnemies（新帧可以再击）
      b.hitEnemies = new Set();
      continue; // 激光已经在上方做过出界检测了，跳过下面重复检测
    }else{
      b.y -= b.speed;
      if(b.vx) b.x += b.vx;
    }

    // 出界销毁
    if(b.y < -30 || b.x < -20 || b.x > canvas.width+20 || b.y>canvas.height+20){
      bullets.splice(i, 1);
    }
  }
}

function drawBullets(){
  for(const b of bullets){
    if(b.type==="laser"){
      ctx.save();
      ctx.translate(b.x, b.y);
      const angle = Math.atan2(b.vy, b.vx) + Math.PI/2;
      ctx.rotate(angle);
      ctx.shadowColor = "#cc66ff";
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#ddaaff";
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
      ctx.fillStyle = "#ff00ff";
      ctx.fillRect(-b.w/4, -b.h/2, b.w/2, b.h);
      ctx.restore();
    }else if(b.type==="missile"){
      ctx.save();
      ctx.translate(b.x, b.y);
      const angle = Math.atan2(b.vy, b.vx) + Math.PI/2;
      ctx.rotate(angle);
      ctx.fillStyle = "#ffaa22";
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
      // 弹头高光
      ctx.fillStyle = "#ffff88";
      ctx.fillRect(-2, -b.h/2, 4, 3);
      ctx.restore();
    }else if(b.type==="gun"){
      ctx.fillStyle="#ffdd66";
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }else{
      ctx.fillStyle="#9be7ff";
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }
  }
}

// ========== 敌机弹幕 雷霆战机扇形斜弹幕 ==========
function updateEnemyBullets(){
  for(let i = enemyBullets.length -1; i >=0; i--){
    const eb = enemyBullets[i];
    eb.x += eb.vx;
    eb.y += eb.vy;
    if(eb.y > canvas.height + 10 || eb.x < -10 || eb.x > canvas.width+10){
      enemyBullets.splice(i,1);
    }
  }
}
function drawEnemyBullets(){
  for(const eb of enemyBullets){
    if(eb.type === "sniper"){
      ctx.fillStyle = "#9944ff";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 3, 0, Math.PI*2);
      ctx.fill();
    } else if(eb.type === "bomber"){
      ctx.fillStyle = "#00ff88";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "rgba(0,255,136,0.3)";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 9, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ff5555";
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, 4, 0, Math.PI*2);
      ctx.fill();
    }
  }
}
